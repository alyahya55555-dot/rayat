<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ميدان بناء — منصة مسابقات فريق بناء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700;800&display=swap">
<style>:root{--bg:#04141A;--bg2:#0A2028;--mint:#DCF5E2;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--tx:#F3F6FF;--mut:#9AA6C2;--brand:#22A391;--brand2:#A3D68F;--ok:#22C55E;--bad:#EF4444;--warn:#F59E0B;--r:18px;--fh:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;--fb:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased}
body{direction:rtl;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.h{font-family:var(--fh)}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;transition:transform .08s,background .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:transparent;color:#04110F}
.btn.gold{background:var(--brand2);color:#1A1203;border-color:transparent}
.btn.ok{background:var(--ok);color:#03140A;border-color:transparent}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn.big{padding:16px 22px;font-size:18px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.in{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:600;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.dot.warn{background:var(--warn)}
.dot.off{background:var(--bad)}
.note{font-size:13px;color:var(--mut);line-height:1.7}
.warnbox{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.infobox{background:rgba(25,184,166,.1);border:1px solid rgba(25,184,166,.35);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 85% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%),radial-gradient(800px 600px at 0% 110%,color-mix(in srgb,var(--brand2) 14%,transparent),transparent 60%)}
#app{position:relative;z-index:1;min-height:100%}
.logo-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.wordmark{font-family:var(--fh);font-weight:800;letter-spacing:-.5px}
.wordmark b{color:var(--brand)}

/* ===== بوابة الدخول ===== */
.landing{min-height:100vh;display:grid;place-items:center;padding:24px}
.landing .box{width:min(980px,100%)}
.landing h1{font-family:var(--fh);font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.1}
.landing h1 span{color:var(--brand)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.role{text-align:right;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.2s;display:flex;flex-direction:column;gap:8px}
.role:hover{border-color:var(--brand);transform:translateY(-2px)}
.role .ic{font-size:34px}
.role b{font-family:var(--fh);font-size:20px}
@media(max-width:760px){.roles{grid-template-columns:1fr}}

/* ===== لوحة المشرف ===== */
.host{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(7,11,22,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:18px}
.hbar .brand .lg{width:36px;height:36px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--card2)}
.code-badge{font-family:var(--fh);font-weight:800;font-size:20px;letter-spacing:4px;padding:4px 12px;border-radius:10px;background:var(--brand2);color:#1A1203;direction:ltr}
.hmain{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:14px;padding:14px}
@media(max-width:1100px){.hmain{grid-template-columns:1fr}}
.deck{display:flex;flex-direction:column;gap:12px}
.deck .q{font-family:var(--fh);font-size:22px;line-height:1.5;font-weight:700}
.ans-secret{background:rgba(34,197,94,.12);border:1px dashed rgba(34,197,94,.6);border-radius:12px;padding:10px 12px;font-weight:700}
.ans-secret small{display:block;font-weight:400;color:var(--mut);margin-top:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.preview{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.preview .stage-wrap{position:absolute;inset:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.tab{padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.tab.on{background:var(--card2);color:var(--tx)}
.tcard{border-radius:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--tc)}
.tcard .sc{font-family:var(--fh);font-size:30px;font-weight:800}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--brand));border-radius:9px;transition:width .4s}
.cards-row{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.chipbtn.armed{background:var(--brand2);color:#1A1203}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl th{color:var(--mut);font-weight:600;font-size:12px}
.scroll{max-height:420px;overflow:auto}
.sched{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.sched .s{flex:1 0 auto;min-width:74px;padding:6px 8px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:pointer}
.sched .s.cur{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,transparent)}
.sched .s.past{opacity:.5}
.timerbox{font-family:var(--fh);font-size:34px;font-weight:800;direction:ltr;min-width:90px;text-align:center}
.member{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:9px;background:var(--card);font-size:13px}
.member.quiet{outline:1px dashed var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:20px}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.seg-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seg-pick .g{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:right;font-size:13px}
.seg-pick .g b{display:block;font-size:15px;margin-bottom:3px}
.boxgrid-h{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boxgrid-h button{aspect-ratio:2/1;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-family:var(--fh);font-size:20px}
.boxgrid-h button.op{opacity:.35}


/* ===== شاشة العرض: الجزيرة — مساحة منطقية 1920×1080 ===== */
.stage-host{position:fixed;inset:0;background:#062a38;overflow:hidden}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:var(--fb);background:#083a52}
.isl-wrap{position:absolute;inset:0;transition:transform 1s cubic-bezier(.3,.8,.2,1),opacity .6s,filter .6s;transform-origin:0 0}
.isl{width:1920px;height:1080px;display:block}
.stage[data-mode="side"] .isl-wrap{transform:translate(20px,170px) scale(.53)}
.stage[data-mode="focus"] .isl-wrap{opacity:.18;filter:blur(3px)}
.isl text{font-family:var(--fh)}
.waves path{animation:wave 6s ease-in-out infinite alternate}
.waves path:nth-child(2n){animation-duration:8s}
@keyframes wave{to{transform:translateX(30px)}}
.mill{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.smoke circle{animation:smoke 3s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:1s}.smoke circle:nth-child(3){animation-delay:2s}
@keyframes smoke{0%{opacity:0;transform:translateY(10px)}40%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.flag{animation:flagw 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes flagw{to{transform:skewY(-8deg) scaleX(.9)}}
.bld{transform-box:view-box}
.bld.b-new{animation:rise 1.1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rise{0%{transform:scale(0);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
.dust{animation:dust 1.6s ease-out forwards}
@keyframes dust{0%{opacity:.9}100%{opacity:0;transform:translateY(-40px) scale(1.8)}}
.float{animation:floatUp 2s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.fw{stroke-dasharray:80;stroke-dashoffset:80;animation:fw 1.6s ease-out forwards}
@keyframes fw{0%{stroke-dashoffset:80;opacity:1}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-80;opacity:0}}
.lbl rect:first-of-type{filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.lbl.lead rect:first-of-type{stroke:#f4d35e;stroke-width:6}
.lbl.win{animation:winb 1.2s ease-in-out infinite alternate}
@keyframes winb{to{transform:translateY(-8px)}}
.crown-i{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.rank-b{animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
.st-top{position:absolute;top:22px;right:40px;left:40px;display:flex;align-items:center;gap:20px;height:110px;z-index:3;pointer-events:none}
.st-logo{height:110px;width:auto;display:flex;align-items:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.st-logo img{height:110px;width:auto}
.st-title{font-family:var(--fh);font-weight:800;font-size:38px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.st-seg{margin-inline-start:auto;display:flex;align-items:center;gap:14px;font-family:var(--fh);font-size:32px;font-weight:700;background:rgba(4,20,26,.72);border:1px solid rgba(255,255,255,.15);padding:10px 24px;border-radius:999px}
.st-seg small{font-size:22px;color:var(--mut);font-weight:500}
.st-seg .x2{color:#f4d35e}
.ring{position:absolute;top:150px;left:44px;width:150px;height:150px;z-index:4}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fh);font-size:56px;font-weight:800;direction:ltr}
.ring .lbl{position:absolute;bottom:-30px;width:100%;text-align:center;color:#cfe;font-size:20px}
.ring.low .num{color:#ff6b6b;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.panel{position:absolute;top:150px;bottom:40px;right:40px;width:900px;z-index:3;background:rgba(4,20,26,.86);border:1px solid rgba(255,255,255,.12);border-radius:32px;padding:34px 38px;display:flex;flex-direction:column;gap:22px;backdrop-filter:blur(6px);animation:slideIn .6s cubic-bezier(.2,.9,.3,1)}
@keyframes slideIn{0%{transform:translateX(-60px);opacity:0}100%{transform:none;opacity:1}}
.panel .q{font-family:var(--fh);font-size:50px;font-weight:700;line-height:1.35;text-wrap:balance}
.panel .q.sm{font-size:40px}
.panel .sub{font-size:28px;color:var(--mut)}
.choices{display:grid;grid-template-columns:1fr;gap:14px}
.ch{position:relative;display:flex;align-items:center;gap:18px;padding:16px 22px;border-radius:20px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);font-family:var(--fh);font-size:34px;font-weight:600;overflow:hidden}
.ch .L{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-weight:800;flex:none}
.ch .cnt{margin-inline-start:auto;font-size:28px;color:var(--mut)}
.ch i{position:absolute;bottom:0;right:0;height:6px;background:#f4d35e}
.ch.ok{border-color:var(--ok);background:rgba(34,197,94,.2)}
.ch.ok .L{background:var(--ok);color:#04130A}
.ch.dim{opacity:.35}
.st{font-family:var(--fh);font-size:32px;text-align:center;color:#dfe}
.st.sm{font-size:26px}
.st .g{color:#7CFC9A}.st .gold{color:#f4d35e}
.late{font-size:22px;color:var(--mut);margin-top:10px}
.pill-t{display:inline-flex;gap:12px;align-items:center;padding:12px 26px;border-radius:999px;background:var(--tc);color:#fff;font-weight:800}
.prog{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.prog span{padding:10px 20px;border-radius:99px;background:rgba(255,255,255,.08);border-bottom:5px solid var(--tc);font-size:26px;font-family:var(--fh)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.res div{padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.07);border-inline-start:8px solid var(--tc);display:flex;align-items:center;gap:14px;font-size:28px;font-family:var(--fh)}
.res .p{margin-inline-start:auto;font-weight:900;color:#7CFC9A;direction:ltr}
.res small{font-size:20px;color:var(--mut)}
.vs{display:flex;align-items:center;justify-content:center;gap:24px}
.vs span{padding:12px 30px;border-radius:18px;background:var(--tc);font-family:var(--fh);font-size:38px;font-weight:800;color:#fff;min-width:260px;text-align:center}
.vs span.lk{opacity:.35;filter:grayscale(.6)}
.vs b{font-size:52px}
.tr-h{font-family:var(--fh);font-size:34px;text-align:center;padding:14px;border-radius:20px;background:linear-gradient(90deg,rgba(244,211,94,.25),rgba(244,211,94,.08));border:2px solid #f4d35e}
.tr-h b{color:#f4d35e}
.wl-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wl-list span{padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.08);border-bottom:5px solid var(--tc);font-size:28px;font-family:var(--fh)}
.wl-list span.ok{background:rgba(34,197,94,.22)}
.term{background:#020a06;border:2px solid #1f6f4a;border-radius:22px;padding:24px 28px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#5CFF9D;display:flex;flex-direction:column;gap:12px}
.term .tl{font-size:30px;direction:rtl}
.tt{display:flex;gap:18px;align-items:center;padding:12px 18px;border-radius:12px;background:rgba(92,255,157,.06);border-inline-start:10px solid var(--tc);font-size:28px;font-family:var(--fh);color:#d8ffe8}
.tt small{margin-inline-start:auto;color:#7fbf9b;font-size:20px}
.tt.ok{background:rgba(92,255,157,.2)}.tt.lk{background:rgba(239,68,68,.18)}
.center{position:absolute;inset:150px 60px 50px;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card-c{background:rgba(4,20,26,.86);border:1px solid rgba(255,255,255,.14);border-radius:40px;padding:46px 70px;text-align:center;max-width:1300px;backdrop-filter:blur(6px);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
.card-c.slim{padding:22px 50px}
.card-c.top{align-self:flex-start;margin-top:-10px}
.card-c .ico{font-size:120px;line-height:1}
.card-c .h1,.join-card .h1,.win-card .h1{font-family:var(--fh);font-size:60px;font-weight:900}
.card-c .h1.big{font-size:100px;margin-top:10px}
.card-c .h1 span,.join-card .h1 span,.win-card .h1 span{color:var(--brand2)}
.how{display:flex;flex-direction:column;gap:16px;margin-top:28px;text-align:right}
.how div{font-size:40px;display:flex;gap:20px;align-items:center;animation:fadeUp .6s both}
.how b{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#03110F;display:grid;place-items:center;flex:none;font-family:var(--fh)}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
.x2b{margin-top:24px;font-family:var(--fh);font-size:40px;color:#f4d35e}
.pitch{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.pitch div{font-family:var(--fh);font-size:44px;font-weight:600;animation:fadeUp .7s both}
.wl{height:240px;display:flex;justify-content:center;margin-bottom:16px}
.wl img{height:100%;width:auto}
.wl.small{height:150px}
.join-card{display:grid;grid-template-columns:1fr 460px;gap:50px;align-items:center;background:rgba(4,20,26,.88);border:1px solid rgba(255,255,255,.14);border-radius:40px;padding:40px 50px;width:1500px;pointer-events:auto;animation:pop .6s both}
.join-card .code{font-family:var(--fh);font-size:140px;font-weight:900;letter-spacing:18px;color:#f4d35e;direction:ltr;text-align:right;line-height:1.1}
.join-card .url{font-size:24px;color:var(--mut);direction:ltr;text-align:right;word-break:break-all}
.join-card .qr{background:#fff;border-radius:26px;padding:22px;width:460px;height:460px}
.join-card .qr svg{width:100%;height:100%}
.tcount{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.tcount span{padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.08);font-size:30px;border-bottom:5px solid var(--tc);font-family:var(--fh)}
.hl{display:grid;gap:18px;margin-top:24px}
.hl div{display:flex;align-items:center;gap:24px;padding:20px 30px;border-radius:24px;background:rgba(255,255,255,.07);border-inline-start:12px solid var(--tc);font-size:36px;animation:fadeUp .7s both;text-align:right}
.hl span{font-family:var(--fh);font-weight:800;color:#f4d35e;min-width:330px}
.hl small{margin-inline-start:auto;color:var(--mut);font-size:26px}
.win-card{align-self:flex-end;margin-bottom:10px;text-align:center;background:rgba(4,20,26,.85);border:3px solid var(--tc);border-radius:40px;padding:26px 60px;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 0 80px color-mix(in srgb,var(--tc) 50%,transparent)}
.win-card .wl{height:150px}
.scene-wrap{width:1700px;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
.scene-wrap .scene{width:1700px;height:auto;border-radius:30px;border:6px solid rgba(255,255,255,.85);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.scene-h{font-family:var(--fh);font-size:44px;font-weight:800;background:rgba(4,20,26,.8);padding:8px 30px;border-radius:99px}
.scene-q{font-family:var(--fh);font-size:46px;font-weight:800;background:rgba(4,20,26,.85);padding:10px 34px;border-radius:24px}
.notes{position:absolute;left:40px;bottom:30px;z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.note-b{padding:14px 26px;border-radius:99px;background:rgba(4,20,26,.9);border:3px solid var(--tc);font-size:28px;font-family:var(--fh);animation:fadeUp .5s both}
.banner-layer{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none}

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};

    // قوة الملاحظة: مشهد مرسوم يُعرض ثم يُسأل عنه (أو يتغيّر شيء فيه)

    nextItem() {

    }
    // فتح السؤال

      if (seg.mode === 'all') { it.denom = {}; s.teams.forEach(t => { it.denom[t.id] = Math.max(1, this.teamMembers(t.id, true).length); }); }
      if (it.kind === 'vault') this.vaultDist(it);

    afterShow() { const seg = this.s.seg, it = this.item(); if (!it || seg.phase !== 'show') return; it.view = it.B ? 'B' : null; this.openItem(); }

    // ---------- الاستباق ----------
    canBuzz(sid) {
      const s = this.s, seg = s.seg, it = this.item(), st = s.students[sid];

    }
    // المرجع: ترتيب وصول الضغطات إلى حاسوب المشرف عبر خادم البث (لا يُستخدم وقت الجوال)
    buzz(sid, qid) {

    }
    answerCounts() { const it = this.item(), byTeam = {}; if (!it || !it.answers) return { n: 0, byTeam }; Object.keys(it.answers).forEach(sid => { const st = this.s.students[sid]; if (st) byTeam[st.team] = (byTeam[st.team] || 0) + 1; }); return { n: Object.keys(it.answers).length, byTeam }; }

    // ---------- نهاية الجولة والافتتاح والتتويج ----------

      if (built[0] && built[0].v > 0 && (!built[1] || built[0].v > built[1].v)) out.push({ k: 'build', team: built[0].t, v: built[0].v });
      const gold = T.map(t => ({ t: t.id, v: this.vil(t.id).earned })).sort((a, b) => b.v - a.v);

    startTiebreak() {

      this.lastSummary = { code: s.code, title: s.title, at: this.now(), teams: rk.map(r => ({ name: this.team(r.id).name, color: this.team(r.id).color, score: r.score, rank: r.rank, built: this.buildScore(r.id) })), players: Object.keys(s.students).length };
      return this.lastSummary;
    }

    // رسائل خاصة لكل جوال (تُشفَّر في طبقة الاتصال): تلميحات الخزنة
    privData() {

        out[st.sid] = o;
      });

    c.onConnectionLost = () => { l.up = false; this.active = null; this.net.fire('status'); if (gen === this.gen && !l.dead) setTimeout(() => this.attempt(0, gen), 1000); };
    try {
      c.connect(this.connOpts(b, () => {
        if (gen !== this.gen || l.dead) { try { c.disconnect(); } catch (e) { } return; }
        l.up = true; this.active = l; c.subscribe(this.base + 'h/+', { qos: 1 }); this.net.fire('status'); this.net.fire('mqup');
        // إن لم يكن هذا الخادم الأول، نحاول العودة إليه لاحقًا
        if (i !== 0) { clearTimeout(this.backT); this.backT = setTimeout(() => this.tryPrimary(gen), 30000); }
      }, () => { if (gen === this.gen && !l.dead) setTimeout(() => this.attempt(idx + 1, gen), 300); }));
    } catch (e) { setTimeout(() => this.attempt(idx + 1, gen), 400); }
  }
  tryPrimary(gen) {
    if (gen !== this.gen || !this.active || this.active.i === 0) return;
    const b = BROKERS[0], l = { b, i: 0, up: false, dead: false, tries: 0 };
    let c; try { c = this.client(b, 0, l); } catch (e) { return; } l.c = c;
    c.connect(this.connOpts(b, () => {
      if (gen !== this.gen) { try { c.disconnect(); } catch (e) { } return; }
      const old = this.active; l.up = true; this.links = [l]; this.active = l; c.subscribe(this.base + 'h/+', { qos: 1 });
      c.onConnectionLost = () => { l.up = false; this.active = null; this.net.fire('status'); if (gen === this.gen) setTimeout(() => this.attempt(0, gen), 1000); };
      if (old) { old.dead = true; try { old.c.disconnect(); } catch (e) { } }
      this.net.fire('status'); this.net.fire('mqup');
    }, () => { clearTimeout(this.backT); this.backT = setTimeout(() => this.tryPrimary(gen), 30000); }));
  }
  upCount() { return this.links.filter(l => l && l.up).length; }
  // نشر رسالة موقّعة
  async pub(sub, data, qos = 1) {
    const k = await this.ensureKey(); const d = JSON.stringify(data);
    const env = k ? JSON.stringify({ k: k.pub, s: await Sign.sign(k.priv, sub + '|' + d), d }) : JSON.stringify({ d });
    const targets = this.multi ? this.links.filter(l => l && l.up) : (this.active && this.active.up ? [this.active] : []);
    targets.forEach(l => { try { const m = new Paho.Message(env); m.destinationName = this.base + sub; m.qos = qos; l.c.send(m); this.stats.out++; } catch (e) { } });
    return targets.length;
  }
  async onMsg(topic, payload, link) {
    this.stats.in++;
    if (!topic.startsWith(this.base)) return;
    const sub = topic.slice(this.base.length);
    let env; try { env = JSON.parse(payload); } catch (e) { return; }
    if (sub.startsWith('p/')) {
      if (!this.multi) return;
      const cid = sub.slice(2), peer = 'mq:' + cid;
      if (env.bye) { this.net.fire('bcbye', peer); return; }
      if (!env.k || !env.s || typeof env.d !== 'string') { this.stats.bad++; return; }
      if (!(await Sign.verify(env.k, env.s, sub + '|' + env.d))) { this.stats.bad++; return; }
      let pr; try { pr = JSON.parse(env.d); } catch (e) { return; }
      const fp = await Sign.fp(env.k);
      // منع إعادة الإرسال القديم: كل رسالة تحمل عدّادًا متزايدًا
      const last = this.seen || (this.seen = new Map()); const prev = last.get(cid);
      if (prev && prev.k === env.k && typeof pr._n === 'number' && pr._n <= prev.n) return;
      last.set(cid, { k: env.k, n: pr._n || 0 });
      this.net.fire('bcpres', peer, pr, pr.c, fp);
      return;
    }
    if (sub.startsWith('h/')) {
      const t = { 'h/s': 'state', 'h/r': 'roster', 'h/v': 'priv' }[sub]; if (!t) return;
      if (!env.k || !env.s || typeof env.d !== 'string') { this.stats.bad++; return; }
      const fp = await Sign.fp(env.k);
      if (this.role === 'host') { if (this.key && env.k !== this.key.pub && t === 'state') this.net.fire('foreignhost', fp); return; }
      if (!this.net.trustHost(fp)) { this.stats.bad++; return; }
      if (!(await Sign.verify(env.k, env.s, sub + '|' + env.d))) { this.stats.bad++; return; }
      let d; try { d = JSON.parse(env.d); } catch (e) { return; }
      this.net.fire(t, d, { peer: 'mq-host', viaMQ: true });
    }
  }
  label() {
    const up = this.upCount();
    if (this.failed === 'no-lib') return { cls: 'off', t: 'مكتبة البث لم تُحمَّل' };
    if (this.multi) return up ? { cls: 'on', t: `متصل بالإنترنت عبر ${up} من ${BROKERS.length} خوادم بث` } : { cls: 'warn', t: 'جارٍ الاتصال بخوادم البث…' };
    return up ? { cls: 'on', t: 'متصل عبر ' + (this.active ? this.active.b.n : 'الإنترنت') } : { cls: 'warn', t: 'جارٍ الاتصال…' };
  }
}

/* ===== رسم الجزيرة والقرى (منظور متساوي القياس) + شاشة الجمهور ===== */
const ISO_A = 78; // نصف عرض البلاطة
const SLOT = { castle: [0, 0], library: [1, 0], workshop: [2, 0], house: [0, 1], market: [1, 1], farm: [2, 1] };
const BICON = { house: '🏠', farm: '🌾', market: '🏪', workshop: '🔨', library: '📚', castle: '🏰' };
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }
const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
const poly = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
// صندوق متساوي القياس قاعدته معيّن حول (x,y)
function isoBox(x, y, s, h, c, o = {}) {
  const L = [x - s, y], F = [x, y + s / 2], R = [x + s, y], K = [x, y - s / 2];
  const up = p => [p[0], p[1] - h];
  let g = poly([L, F, up(F), up(L)], shade(c, -.12), 'stroke="rgba(0,0,0,.25)" stroke-width="1"') + poly([F, R, up(R), up(F)], shade(c, -.3), 'stroke="rgba(0,0,0,.25)" stroke-width="1"');
  if (!o.noTop) g += poly([up(L), up(F), up(R), up(K)], o.top || shade(c, .12), 'stroke="rgba(0,0,0,.2)" stroke-width="1"');
  return g;
}
const faceL = (x, y, s, u, v) => [x - s + s * u, y + (s / 2) * u - v];
const faceR = (x, y, s, u, v) => [x + s * u, y + s / 2 - (s / 2) * u - v];
const quadL = (x, y, s, u0, u1, v0, v1, fill) => poly([faceL(x, y, s, u0, v0), faceL(x, y, s, u1, v0), faceL(x, y, s, u1, v1), faceL(x, y, s, u0, v1)], fill);
const quadR = (x, y, s, u0, u1, v0, v1, fill) => poly([faceR(x, y, s, u0, v0), faceR(x, y, s, u1, v0), faceR(x, y, s, u1, v1), faceR(x, y, s, u0, v1)], fill);
function pyramid(x, y, s, h, rh, c) { const L = [x - s, y - h], F = [x, y + s / 2 - h], R = [x + s, y - h], A = [x, y - h - rh]; return poly([L, F, A], shade(c, -.05), 'stroke="rgba(0,0,0,.25)"') + poly([F, R, A], shade(c, -.28), 'stroke="rgba(0,0,0,.25)"'); }
function flag(x, y, h, c) { return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#eee" stroke-width="2.5"/><polygon class="flag" points="${x},${y - h} ${x + 26},${y - h + 7} ${x},${y - h + 14}" fill="${c}"/>`; }
const tileDiamond = (x, y, s) => [[x - s, y], [x, y + s / 2], [x + s, y], [x, y - s / 2]];

// ---------- المباني الستة (مستويان) ----------
const BUILDERS = {
  house(x, y, T, tc, lv) {

    g += ch(x + 10, y - h - 8); if (lv > 1) g += ch(x - 16, y - h - 2) + `<circle cx="${x - s * .55}" cy="${y - h * .55}" r="10" fill="none" stroke="${T.accent}" stroke-width="5" stroke-dasharray="4 3"/>`;

  library(x, y, T, tc, lv) {
    const s = 38, h = 34; let g = isoBox(x, y, s, h, T.wall);

    g += poly([[x - s - 4, y - h], [x, y + s / 2 - h + 2], [x + s + 4, y - h], [x, y - s / 2 - h - 2]], shade(T.wall, -.15)) + poly([[x, y + s / 2 - h + 2], [x + s + 4, y - h], [x + s / 2, y - h - 12]], shade(T.roof, -.1));

// قرية واحدة: الأرض والمباني والعلامة

  },

      return `<div class="pl-state big">🎲 كم تراهنون؟</div><div class="mut" style="text-align:center">الإجابة الصحيحة تضيف الرهان، والخاطئة تخصمه</div>${this.wagerBtns(max)}<div class="pl-timer" data-tm></div>`;
    }
    const q = `<div class="pl-q">${esc(I.q || '')}</div>`;
    if (!cap) return q + `<div class="pl-state">قائدكم يختار الإجابة الآن — ساعدوه!</div>`;
    const mine = this.local['w' + I.qid];
    return q + `<div class="pl-choices">${(I.c || []).map((c, i) => `<button data-wpick="${i}" class="${mine === i ? 'sel' : ''}" ${mine != null ? 'disabled' : ''}><span class="L">${LET[i]}</span>${esc(c)}</button>`).join('')}</div>${mine != null ? `<div class="pl-state">${(I.wpick || []).includes(me.team) ? '✅ وصلت إجابتكم' : '⏳ جارٍ الإرسال…'}</div>` : ''}<div class="pl-timer" data-tm></div>`;
  },

  shopHTML(t) {
    const lv = this.levels(t);
    return `<div class="row"><b class="h" style="font-size:20px">🏗️ سوق البناء</b><span class="grow"></span><button class="btn sm" data-act="close">رجوع</button></div>${this.villageBox(t)}<div class="mut" style="text-align:center">💰 ذهب فريقك: <b style="color:var(--gold)">${t.gold}</b></div>
      <div class="shop">${D.BUILD_KEYS.map(k => { const L = lv[k], B = D.BUILD[k], c = L >= 2 ? null : B.cost[L], can = c != null && c <= t.gold; return `<div class="item ${L >= 2 ? 'max' : ''}"><div class="ic">${villageSVG({ id: t.id, color: t.color, theme: t.theme }, { [k]: Math.max(1, Math.min(2, L + 1)) })}</div><div class="tx"><b>${B.name}</b><small>${L === 0 ? 'جديد' : L === 1 ? 'ترقية للمستوى 2' : 'مكتمل ✓'}</small></div>${c != null ? `<button class="btn ${can ? 'pri' : ''}" data-buy="${k}" ${can ? '' : 'disabled'}>${L ? 'ترقية' : 'بناء'} · ${c}💰</button>` : ''}</div>`; }).join('')}</div>`;
  },
  bind() {

    const vi = $('#vcode', this.root); if (vi) vi.oninput = () => { const v = vi.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '').slice(0, 4); this.local['vc' + I.qid] = v; if (vi.value !== v) vi.value = v; };
    const vs = $('[data-vsend]', this.root); if (vs) vs.onclick = () => { const c = this.local['vc' + I.qid] || ''; if (c.length !== 4) return toast('الرمز 4 أرقام'); this.send('vc', { q: I.qid, c }); this.local['vc' + I.qid] = ''; this.vibe(30); toast('أُرسل الرمز'); this._k = null; this.render(); };
    const lv = $('#leave'); if (lv) lv.onclick = () => { this.joined = false; this.cfg.joinedCode = null; this.save(); this.render(); };

  tickUI() { const r = this.clock.rem(); $$('[data-tm]', this.root).forEach(e => { e.textContent = r == null ? '' : '⏱ ' + fmtTime(r); }); if (this.joined && Date.now() - this.hostSeen > 9000) this.renderNet(); }
};

/* ===== لوحة المشرف: منظمة وبسيطة ===== */
const Host = {
  init() {
    this.HS = uid(6); this.sideTab = 'room'; this.bcPeers = new Map(); this.handled = {}; this.display = 0; this.lastMsg = 0; this.sim = { on: false };
    this.sound = LS.get('bena.hostSound', false); this.pks = {}; this.keys = {};
    if (Crypt.ok) Crypt.keypair().then(kp => { this.kp = kp; this.changed(); }).catch(() => { });
    const saved = LS.get('bena.host', null);
    this.custom = LS.get('bena.custom', []); this.disabled = LS.get('bena.disabled', []);
    this.newEngine(null);
    this.root = $('#app');
    this.net = new Net('host');
    this.net.on('peers', ch => this.onPeers(ch));
    this.net.on('bcpres', (peer, pr, code, fp) => this.onBcPres(peer, pr, fp));
    this.net.on('bcbye', peer => this.onLeave(peer));
    this.net.on('foreignhost', fp => this.onForeignHost(fp));
    this.net.on('mqup', () => { this.broadcast(true); this.sendPriv(true); });
    this.net.on('status', () => this.renderBar());
    this.net.on('caps', () => this.onCaps());
    this.net.on('state', P => { if (P && P.code === this.e.s.code && P.hs !== this.HS) { this.otherHost = Date.now(); this.renderBar(); } });
    this.layout();
    this.net.init().then(() => { if (this.net.mq) this.net.mq.ensureKey().then(k => { if (k) { this.fp = k.fp; this.render(); this.broadcast(true); } }); });
    if (saved && saved.code && saved.ver === 4) this.resumeAsk(saved);
    setInterval(() => { this.e.tick(); this.tickUI(); }, 200);
    setInterval(() => this.broadcast(true), 3000);
    setInterval(() => this.sendPriv(true), 6000);
    setInterval(() => this.checkBc(), 3000);
    setInterval(() => this.simTick(), 350);
    window.addEventListener('beforeunload', () => this.saveNow());
    document.addEventListener('keydown', e => this.key(e));
  },
  newEngine(state) { this.e = new Engine(D, { state, custom: this.custom, disabled: this.disabled }); this.e.onChange = () => this.changed(); },
  resumeAsk(saved) {
    modal(`<div class="col"><div class="h" style="font-size:20px">مسابقة محفوظة</div><div class="note">وُجدت مسابقة سابقة (الرمز ${esc(saved.code)}، ${Object.keys(saved.students || {}).length} مشاركًا). هل تستأنفها؟</div><div class="row"><button class="btn pri" data-r>استئناف</button><button class="btn" data-close>مسابقة جديدة</button></div></div>`, (m, close) => {
      $('[data-r]', m).onclick = () => { close(); this.newEngine(saved); Object.values(this.e.s.students).forEach(s => { if (!s.sid.startsWith('bot-')) s.online = false; }); this.afterReset(); toast('تم الاستئناف'); };
    });
  },
  afterReset() { this.handled = {}; this.net.joinRoom(this.e.s.code); this.stage.prevScores = {}; this.changed(); },
  async onCaps() {
    await this.net.joinRoom(this.e.s.code); this.net.presence({ r: 'h', c: this.e.s.code }); this.renderBar();
    const u = this.net.user; if (u) { try { this.uidv = await u.id(); } catch (e) { } }
    if (this.net.db && this.uidv && !LS.get('bena.host', null)) { try { const d = await this.net.db.doc(`data/users/${this.uidv}/current`).get(); if (d.exists && d.data().s) { const s = JSON.parse(d.data().s); if (s && s.ver === 4 && s.code && !this.e.s.clock.startedAt) this.resumeAsk(s); } } catch (e) { } }
  },
  // ---------- استقبال الجوالات ----------
  onPeers(ch) {
    this.lastMsg = Date.now();
    [...ch.joined, ...ch.updated].filter(p => !p.sameTab && p.kind === 'viewer').sort((a, b) => a.updatedAt - b.updatedAt).forEach(p => this.onPres(p.peer, p.presence || {}, p.by));
    ch.left.forEach(p => this.onLeave(p.peer));
    this.display = ch.peers.filter(p => p.presence && p.presence.r === 'd').length;
    this.otherHostPeer = ch.peers.some(p => !p.isMe && p.presence && p.presence.r === 'h' && p.presence.c === this.e.s.code);
    if (ch.joined.length) this.broadcast(true);
    this.renderBar();
  },
  onBcPres(peer, pr, fp) { const isNew = !this.bcPeers.has(peer); this.bcPeers.set(peer, Date.now()); this.lastMsg = Date.now(); if (isNew) { setTimeout(() => this.broadcast(true), 50); setTimeout(() => this.sendPriv(true), 400); } if (pr.r === 'd') { this.bcDisplay = Date.now(); return; } this.onPres(peer, pr, fp || null); },
  checkBc() { const now = Date.now(); this.bcPeers.forEach((t, peer) => { if (now - t > 10000) { this.bcPeers.delete(peer); this.onLeave(peer); } }); },
  onLeave(peer) { const st = Object.values(this.e.s.students).find(s => s.peer === peer); if (st) this.e.setOffline(st.sid); },
  onForeignHost() { const s = this.e.s; if (!s.clock.startedAt && !Object.keys(s.students).length) { s.code = this.e.makeCode(); this.afterReset(); toast('الرمز كان مستخدمًا في مسابقة أخرى، فأنشأت رمزًا جديدًا: ' + s.code); } else { this.foreign = Date.now(); this.renderBar(); } },
  onPres(peer, pr, by) {
    const E = this.e; if (pr.r !== 's' || !pr.sid || pr.c !== E.s.code) return;
    const sid = String(pr.sid).slice(0, 16), ex = E.s.students[sid];
    if (ex && ex.by && by && ex.by !== by) return; // منع انتحال هوية طالب آخر
    const st = E.upsertStudent({ sid, name: pr.nm, want: pr.tw, peer, by }); if (!st) return;
    if (pr.pk && this.pks[sid] !== pr.pk) { this.pks[sid] = pr.pk; this.schedulePriv(); }
    const h = this.handled[sid] = this.handled[sid] || {}, it = E.item();
    const fresh = f => { const m = pr[f]; if (!m || typeof m.n !== 'number' || m.n <= (h[f] || 0)) return null; h[f] = m.n; return m; };
    let m;
    if ((m = fresh('bz')) && it && m.q === it.qid && m.o === it.bo) E.buzz(sid, m.q);
    if ((m = fresh('an')) && it) E.answer(sid, m.q, m.v);
    if ((m = fresh('vc')) && it) E.vaultTry(sid, m.q, m.c);
    if ((m = fresh('buy'))) E.buy(st.team, String(m.k), sid);
    if ((m = fresh('th'))) E.setTheme(st.team, String(m.t), sid);
    if ((m = fresh('wg')) && it && m.q === it.qid) E.setWager(st.team, m.v, sid);
    if ((m = fresh('wp')) && it && m.q === it.qid) E.wagerPick(st.team, m.v, sid);
  },
  // ---------- البث والحفظ ----------
  changed() {
    if (!this.bq) this.bq = setTimeout(() => { this.bq = null; this.broadcast(false); }, 40);
    if (!this.rq) this.rq = requestAnimationFrame(() => { this.rq = null; this.render(); });
    if (!this.sq) this.sq = setTimeout(() => { this.sq = null; this.saveNow(); }, 500);
    this.schedulePriv();
    if (this.e.lastSummary && this.e.lastSummary !== this.archived) { this.archived = this.e.lastSummary; this.archive(this.e.lastSummary); }
  },
  pubState() { const P = this.e.pub(); P.hs = this.HS; if (this.kp) P.hk = this.kp.pub; if (this.fp) P.fp = this.fp; return P; },
  broadcast(force) {
    const P = this.pubState(); this.net.emit('state', P);
    const R = this.e.roster(), rs = JSON.stringify(R.L);

      <div class="row wrap"><label class="row">وقت الإجابة بعد الاستباق <input class="in sm" style="width:60px" type="number" min="3" max="60" data-set="answerTime" value="${st.answerTime}"> ث</label><label class="row">ذهب سفينة الكنز <input class="in sm" style="width:60px" type="number" min="0" max="200" data-set="treasureGold" value="${st.treasureGold}"></label></div>

  onChangeInput(x) {
    const E = this.e;
    if (x.dataset.set) { let v = x.type === 'checkbox' ? x.checked : x.value; if (x.type === 'number') v = +v; E.setSetting(x.dataset.set, v); }
    if (x.dataset.move) E.moveStudent(x.dataset.move, x.value);
    if (x.dataset.cap) E.setCaptain(x.dataset.cap, x.value);
    if (x.hasAttribute('data-simon')) this.sim.on = x.checked;
    if (x.dataset.pmin) { E.s.plan[+x.dataset.pmin].min = Math.max(1, +x.value || 1); E.touch(); }
    if (x.dataset.pcnt) { E.s.plan[+x.dataset.pcnt].count = Math.max(1, Math.min(20, +x.value || 1)); E.touch(); }
    if (x.dataset.bf) { this.bf[x.dataset.bf] = x.value; this.renderSide(); }
    if (x.hasAttribute('data-title')) { E.s.title = x.value.slice(0, 40) || 'ميدان بناء'; E.touch(); }
    if (x.dataset.tname) { const L = E.s.teams.map(t => ({ ...t })); L[+x.dataset.tname].name = x.value; E.setTeams(L); }
    if (x.dataset.tcolor) { const L = E.s.teams.map(t => ({ ...t })); L[+x.dataset.tcolor].color = x.value; E.setTeams(L); }
    if (x.dataset.wpick) { if (x.value !== '') E.wagerPick(x.dataset.wpick, +x.value, null); }
    if (x.dataset.wager) E.setWager(x.dataset.wager, x.value, null);
    if (x.hasAttribute('data-logo')) this.loadLogo(x.files[0]);
    if (x.hasAttribute('data-font')) { const f = x.files[0]; if (f) { const r = new FileReader(); r.onload = () => { if (!LS.set('bena.font', r.result)) toast('الملف كبير؛ سيعمل حتى إغلاق الصفحة فقط'); Brand.apply(); toast('تم تحميل الخط'); }; r.readAsDataURL(f); } }
    if (x.hasAttribute('data-url')) { LS.set('bena.url', x.value.trim()); this.broadcast(true); this.renderSide(); }
  },
  loadLogo(f) {
    if (!f) return; const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/png'); LS.set('bena.logo', url); this.net.emit('logo', url); this.stage.refreshLogo(); this.render(); toast('تم تحديث الشعار'); }; img.src = r.result; };
    r.readAsDataURL(f);
  },
  // ---------- الأوامر ----------
  act(a, arg) {
    const E = this.e, s = E.s, [x, y] = String(arg || '').split('|');
    switch (a) {
      case 'start': E.goSegment(0); break;
      case 'goseg': if (s.planIdx >= 0 && +arg !== s.planIdx) confirmBox('الانتقال إلى «' + E.segName(s.plan[+arg].g) + '»؟ النقاط محفوظة.', () => E.goSegment(+arg)); else E.goSegment(+arg); break;
      case 'nextseg': E.nextSegment(); break;
      case 'next': E.nextItem(); break;
      case 'open': E.openItem(); break;
      case 'aftershow': E.afterShow(); break;
      case 'skip': E.skipItem(); break;
      case 'endseg': confirmBox('إنهاء الجولة الآن؟ النقاط المكتسبة محفوظة.', () => E.finishSeg()); break;
      case 'judge': E.judge(arg === '1'); break;
      case 'reopen': E.reopen(); break;
      case 'reveal': E.revealItem(); break;
      case 'lock': E.lockAll(); break;
      case 'mbuzz': E.manualBuzz(arg); break;
      case 'vaultman': E.crack(arg, null); break;
      case 'lockw': E.lockWagers(); break;
      case 'judgew': E.judgeWager(); break;
      case 'tiebreak': E.startTiebreak(); break;
      case 'backcrown': E.goSegment(s.returnTo != null ? s.returnTo : s.plan.length - 1); break;
      case 'pause': E.pauseTimer(); break;
      case 'resume': E.resumeTimer(); break;
      case 'add10': E.addTime(10); break;
      case 'undo': { const l = E.undo(); toast(l ? 'تم التراجع: ' + l : 'لا يوجد ما يُتراجع عنه'); break; }
      case 'adj': E.manualAdjust(x, +y); break;
      case 'gold': E.manualGold(x, +y); break;
      case 'buildm': this.buildModal(arg); break;
      case 'tab': this.sideTab = arg; this.renderSide(); break;
      case 'copy': this.copy(arg); break;
      case 'newcode': s.code = E.makeCode(); this.afterReset(); break;
      case 'balance': confirmBox('إعادة توزيع كل الطلاب على الفرق بالقرعة؟', () => E.autoBalance()); break;
      case 'kick': confirmBox('إزالة هذا المشارك؟', () => E.removeStudent(arg, true)); break;
      case 'bots': this.addBots(+arg); break;
      case 'nobots': this.removeBots(); break;
      case 'plan60': s.plan = JSON.parse(JSON.stringify(D.DEFAULT_PLAN)); if (s.planIdx >= s.plan.length) s.planIdx = s.plan.length - 1; E.touch(); break;
      case 'qtoggle': { const i = this.disabled.indexOf(arg); if (i >= 0) this.disabled.splice(i, 1); else this.disabled.push(arg); this.saveBank(); this.renderSide(); break; }
      case 'qdel': this.custom = this.custom.filter(c => c.id !== arg); this.saveBank(); this.renderSide(); break;
      case 'qadd': this.qAddForm(); break;
      case 'qimport': this.qImport(); break;
      case 'qexport': this.textOut('الأسئلة المخصّصة (JSON)', JSON.stringify(this.custom, null, 1)); break;
      case 'tdel': E.setTeams(s.teams.filter((_, i) => i !== +arg)); break;
      case 'tadd': { const L = s.teams.map(t => ({ ...t })), i = L.length, used = new Set(L.map(t => t.id)); let id = 't' + (i + 1), k = i + 1; while (used.has(id)) id = 't' + (++k); L.push({ id, name: BENA_ENGINE.TEAM_NAMES[i] || 'فريق ' + (i + 1), color: BENA_ENGINE.TEAM_COLORS[i] || '#888' }); E.setTeams(L); break; }
      case 'logoreset': LS.del('bena.logo'); this.net.emit('logo', null); this.stage.refreshLogo(); this.render(); break;
      case 'fontreset': LS.del('bena.font'); document.documentElement.style.removeProperty('--fh'); break;
      case 'backup': this.textOut('نسخة احتياطية — احفظ النص في ملف', JSON.stringify(Object.assign({}, s, { undo: [] }))); break;
      case 'restore': modal(`<div class="col"><b>الصق نص النسخة الاحتياطية</b><textarea class="in" rows="8" id="rs" style="direction:ltr"></textarea><div class="row"><button class="btn pri" data-ok>استعادة</button><button class="btn" data-close>إلغاء</button></div></div>`, (m, close) => { $('[data-ok]', m).onclick = () => { try { const st = JSON.parse($('#rs', m).value); if (st.ver !== 4 || !st.teams) throw 0; st.undo = st.undo || []; this.newEngine(st); this.afterReset(); close(); toast('تمت الاستعادة'); } catch (e) { toast('النص غير صالح'); } }; }); break;
      case 'reset': confirmBox('بدء مسابقة جديدة؟ تُمسح النقاط والطلاب والقرى.', () => { const keep = { teams: s.teams, settings: s.settings, plan: s.plan, title: s.title }; this.sim.on = false; this.newEngine(null); Object.assign(this.e.s, JSON.parse(JSON.stringify(keep))); this.e.s.vil = {}; this.e.s.teams.forEach(t => { this.e.s.vil[t.id] = this.e.newVillage(); }); this.afterReset(); }); break;
      case 'sound': this.sound = !this.sound; LS.set('bena.hostSound', this.sound); this.renderBar(); break;
      case 'present': this.presentMode(); break;
      case 'displayhelp': this.displayHelp(); break;
    }
  },
  displayHelp() {
    const url = (pageBase() || '') + '#display-' + this.e.s.code;
    modal(`<div class="col"><div class="h" style="font-size:20px">🖥️ شاشة العرض</div><div class="note" style="color:var(--tx)"><b>شاشة ممتدة (الأفضل):</b> اجعل البروجكتور شاشة ممتدة، وافتح الصفحة نفسها في نافذة ثانية واسحبها إليه، ثم اختر «شاشة العرض» واضغط في أي مكان لتفعيل الصوت وملء الشاشة.<br><br><b>جهاز آخر:</b> افتح المنصة واختر «شاشة العرض» وأدخل الرمز <b>${esc(this.e.s.code)}</b>.<br><br><b>شاشة مكررة:</b> استخدم «▶ العرض في هذه النافذة»، وتخرج منه بـ Esc.</div>${pageBase() ? `<button class="btn pri" data-open>فتح شاشة العرض في نافذة جديدة</button>` : ''}<button class="btn" data-close>حسنًا</button></div>`, (m) => { const b = $('[data-open]', m); if (b) b.onclick = () => { try { window.open(url, 'bena-display', 'popup=yes,width=1280,height=720'); } catch (e) { toast('افتح الرابط يدويًا: ' + url); } }; });
  },
  buildModal(tid) {
    const E = this.e, t = E.team(tid);
    const html = () => { const v = E.vil(tid); return `<div class="col"><div class="h" style="font-size:20px">🏗️ البناء لفريق ${esc(t.name)} — 💰 ${v.gold}</div><div style="max-width:360px;margin:auto">${villageSVG({ id: t.id, color: t.color, theme: v.theme }, v.b, { labels: true })}</div><div class="row wrap"><span class="mut">الطابع:</span>${D.THEME_KEYS.map(k => `<button class="chipbtn ${v.theme === k ? 'armed' : ''}" data-th="${k}">${D.THEMES[k].name}</button>`).join('')}</div>${D.BUILD_KEYS.map(k => { const lv = v.b[k], c = E.buildCost(tid, k); return `<div class="row"><span style="width:90px"><b>${D.BUILD[k].name}</b></span><span class="mut grow">${lv}/2</span><button class="btn sm ${c != null && c <= v.gold ? 'pri' : ''}" data-up="${k}" ${c == null || c > v.gold ? 'disabled' : ''}>${c == null ? 'مكتمل' : (lv ? 'ترقية' : 'بناء') + ' (' + c + ')'}</button></div>`; }).join('')}<div class="note">الأصل أن يشتري القائد من جواله. استخدم هذا للطوارئ.</div><button class="btn" data-close>إغلاق</button></div>`; };
    modal(html(), (m, close) => { const bind = () => { $$('[data-up]', m).forEach(b => b.onclick = () => { E.buy(tid, b.dataset.up, null); m.innerHTML = html(); $$('[data-close]', m).forEach(c => c.onclick = close); bind(); }); $$('[data-th]', m).forEach(b => b.onclick = () => { E.setTheme(tid, b.dataset.th, null); m.innerHTML = html(); $$('[data-close]', m).forEach(c => c.onclick = close); bind(); }); }; bind(); });
  },
  copy(t) { try { navigator.clipboard.writeText(t).then(() => toast('تم النسخ'), () => this.textOut('انسخ النص', t)); } catch (e) { this.textOut('انسخ النص', t); } },
  textOut(title, text) { modal(`<div class="col"><b>${esc(title)}</b><textarea class="in" rows="10" readonly style="direction:ltr;font-size:12px">${esc(text)}</textarea><div class="row"><button class="btn pri" data-cp>نسخ</button><button class="btn" data-close>إغلاق</button></div></div>`, m => { $('[data-cp]', m).onclick = () => { $('textarea', m).select(); try { navigator.clipboard.writeText(text).then(() => toast('تم النسخ'), () => toast('حدّد النص وانسخه يدويًا')); } catch (e) { toast('حدّد النص وانسخه يدويًا'); } }; }); },
  qAddForm() {
    modal(`<div class="col"><b>سؤال جديد</b><textarea class="in" id="nq" rows="2" placeholder="نص السؤال"></textarea><input class="in" id="na" placeholder="الإجابة الصحيحة" style="border-color:var(--ok)"><input class="in" id="w1" placeholder="خيار خاطئ 1"><input class="in" id="w2" placeholder="خيار خاطئ 2"><input class="in" id="w3" placeholder="خيار خاطئ 3"><div class="row"><select class="in" id="nc">${Object.entries(D.CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><select class="in" id="nd"><option value="1">سهل</option><option value="2" selected>متوسط</option><option value="3">صعب</option></select></div><div class="row"><button class="btn pri" data-ok>حفظ</button><button class="btn" data-close>إلغاء</button></div></div>`, (m, close) => {
      $('[data-ok]', m).onclick = () => { const v = id => $('#' + id, m).value.trim(); const c = [v('na'), v('w1'), v('w2'), v('w3')]; if (!v('nq') || c.some(x => !x) || new Set(c).size < 4) return toast('أكمل السؤال وأربعة خيارات مختلفة'); this.custom.push({ id: 'u' + Date.now().toString(36), kind: 'mcq', cat: v('nc'), d: +v('nd'), q: v('nq'), c }); this.saveBank(); close(); this.renderSide(); toast('أُضيف السؤال'); };
    });
  },
  qImport() {
    modal(`<div class="col"><b>استيراد أسئلة</b><div class="note">JSON: [{"q":"…","c":["الصحيحة","خطأ","خطأ","خطأ"],"cat":"general","d":2}] أو CSV: السؤال,الصحيحة,خطأ1,خطأ2,خطأ3,المجال,الصعوبة</div><textarea class="in" rows="8" id="imp" style="direction:ltr"></textarea><label class="btn sm">اختيار ملف<input type="file" hidden id="impf" accept=".json,.csv,.txt"></label><div class="row"><button class="btn pri" data-ok>استيراد</button><button class="btn" data-close>إلغاء</button></div></div>`, (m, close) => {
      $('#impf', m).onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { $('#imp', m).value = t; }); };
      $('[data-ok]', m).onclick = () => {
        const txt = $('#imp', m).value.trim(); let items = [];
        try { items = txt.startsWith('[') ? JSON.parse(txt) : txt.split(/\r?\n/).filter(Boolean).map(l => l.split(',').map(x => x.trim())).filter(r => r.length >= 5).map(r => ({ q: r[0], c: r.slice(1, 5), cat: r[5], d: +r[6] })); } catch (e) { return toast('تعذّرت قراءة النص'); }
        const ok = items.filter(x => x && typeof x.q === 'string' && x.q.trim() && Array.isArray(x.c) && x.c.length === 4 && x.c.every(c => typeof c === 'string' && c) && new Set(x.c).size === 4).map((x, i) => ({ id: 'u' + Date.now().toString(36) + i, kind: 'mcq', q: x.q, c: x.c, cat: D.CATS[x.cat] ? x.cat : 'general', d: [1, 2, 3].includes(+x.d) ? +x.d : 2 }));
        this.custom.push(...ok); this.saveBank(); close(); this.renderSide(); toast('استُورد ' + ok.length + ' من ' + items.length);
      };
    });
  },
  presentMode() {
    SFX.unlock();
    const ov = document.createElement('div'); ov.className = 'stage-host'; ov.style.zIndex = 500; document.body.appendChild(ov);
    const st = new Stage(ov, { sound: true, ambient: true }); st.setRoster(this.e.roster()); st.update(this.pubState()); this.present = st;
    const ex = document.createElement('button'); ex.className = 'btn sm'; ex.textContent = '✕ رجوع للوحة (Esc)'; ex.style.cssText = 'position:fixed;top:8px;left:8px;z-index:501;opacity:.25'; ex.onmouseenter = () => ex.style.opacity = 1; ex.onmouseleave = () => ex.style.opacity = .25;
    const close = () => { ov.remove(); ex.remove(); clearInterval(st.loop); clearInterval(st.ambT); SFX.stopAmbient(); this.present = null; try { document.fullscreenElement && document.exitFullscreen(); } catch (e) { } };
    ex.onclick = close; document.body.appendChild(ex); this.closePresent = close;
    try { document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
  },
  key(e) {
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName)) return;
    if (e.key === 'Escape' && this.present) return this.closePresent();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return this.act('undo'); }
    const seg = this.e.s.seg; if (seg && seg.phase === 'answering' && (e.key === '1' || e.key === '0')) return this.act('judge', e.key);
    if (e.key === ' ' && !e.repeat) { const b = $('#deck .btn.pri.big'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
  },
  tickUI() {
    const r = this.e.remaining(); $$('[data-htm]').forEach(x => { x.textContent = r == null ? '' : fmtTime(r); x.style.color = r != null && r < 5000 ? 'var(--bad)' : ''; });
    const now = Date.now(); if (!this._lb || now - this._lb > 5000) { this._lb = now; this.renderBar(); this.renderSched(); }
  }
};
function fmtMin(m) { const s = Math.max(0, Math.floor(m * 60)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ===== شاشة العرض + البوابة + التوجيه ===== */
const Display = {
  init(code) {
    this.code = code || LS.get('bena.displayCode', '') || '';
    this.root = $('#app'); this.root.innerHTML = '<div class="stage-host" id="dsp"></div>';
    this.stage = new Stage($('#dsp'), { sound: true, ambient: true });
    this.net = new Net('display'); this.lastHs = null; this.lastV = -1; this.got = 0;
    this.net.on('state', P => this.onState(P));
    this.net.on('roster', R => { if (R && R.L) this.stage.setRoster(R); });
    this.net.on('logo', () => this.stage.refreshLogo());
    this.net.on('caps', () => { if (this.code) this.join(this.code); });
    this.net.on('status', () => this.badge());
    this.net.init();
    this.net.presence({ r: 'd' });
    setInterval(() => this.net.heartbeat(), 3000);
    window.addEventListener('pagehide', () => this.net.bye());
    this.overlay();
    setTimeout(() => { if (!this.got) this.askCode(); }, 3500);
  },
  async join(code) { this.code = code; LS.set('bena.displayCode', code); this.net.code = code; await this.net.joinRoom(code); this.net.presence({ r: 'd', c: code }); this.badge(); },
  onState(P) {
    if (!P) return;
    if (this.code && P.code !== this.code) { if (this.got) return; }
    if (!this.code && P.code) { this.code = P.code; this.join(P.code); }
    if (P.hs !== this.lastHs) { this.lastHs = P.hs; this.lastV = -1; }
    if (P.v < this.lastV) return;
    this.lastV = P.v; this.got = Date.now();
    const ask = $('#askcode'); if (ask) ask.remove();
    this.stage.update(P);
  },
  overlay() {
    const o = document.createElement('div'); o.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,20,26,.75);cursor:pointer';
    o.innerHTML = '<div class="card" style="text-align:center;max-width:520px"><div class="h" style="font-size:24px">🖥️ شاشة العرض</div><div class="note" style="margin-top:8px">اضغط في أي مكان لتفعيل الصوت وملء الشاشة</div></div>';
    o.onclick = () => { SFX.unlock(); try { document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { } o.remove(); };
    document.body.appendChild(o);
    const mb = document.createElement('button'); mb.className = 'btn sm'; mb.style.cssText = 'position:fixed;bottom:6px;right:8px;z-index:40;opacity:.35'; const upd = () => { mb.textContent = SFX.on ? '🔊' : '🔇'; };
    mb.onclick = e => { e.stopPropagation(); SFX.unlock(); SFX.on = !SFX.on; if (!SFX.on) SFX.stopAmbient(); upd(); }; upd(); document.body.appendChild(mb);
    const b = document.createElement('div'); b.id = 'dbadge'; b.style.cssText = 'position:fixed;bottom:6px;left:8px;z-index:40;font-size:11px;opacity:.45'; document.body.appendChild(b); this.badge();
  },
  badge() { const b = $('#dbadge'); if (b) { const l = this.net.label(); b.innerHTML = `<span class="dot ${l.cls}"></span> ${esc(l.t)}${this.code ? ' · ' + esc(this.code) : ''}`; } },
  askCode() {
    if ($('#askcode')) return;
    const d = document.createElement('div'); d.id = 'askcode'; d.className = 'card'; d.style.cssText = 'position:fixed;top:16px;left:16px;z-index:60;width:320px';
    d.innerHTML = `<div class="col"><b>لم تصل حالة المسابقة بعد</b><div class="note">إن كانت لوحة المشرف في المتصفح نفسه فستظهر تلقائيًا. على جهاز آخر أدخل رمز الغرفة:</div><div class="row"><input class="in grow" id="dcode" maxlength="4" inputmode="numeric" value="${esc(this.code)}" style="direction:ltr;text-align:center;letter-spacing:6px"><button class="btn pri" id="dgo">ربط</button></div></div>`;
    document.body.appendChild(d);
    $('#dgo').onclick = () => { const c = $('#dcode').value.replace(/\D/g, ''); if (c.length === 4) { this.join(c); toast('جارٍ الربط بالغرفة ' + c); } };
  }
};

const Landing = {
  async init() {
    const root = $('#app');
    root.innerHTML = `<div class="landing"><div class="box"><div class="row" style="gap:28px;align-items:center;flex-wrap:wrap"><div style="height:220px;width:170px;flex:none">${Brand.logoImg()}</div><div><h1>ميدان <span>بناء</span></h1><div class="mut" style="font-size:18px;margin-top:10px">منصة المسابقات الشبابية التفاعلية لفريق بناء</div></div></div>
      <div class="roles">
        <button class="role" data-go="join"><span class="ic">📱</span><b>دخول المتسابق</b><span class="mut">من الجوال: اسمك ورمز الغرفة</span></button>
        <button class="role" data-go="display"><span class="ic">🖥️</span><b>شاشة العرض</b><span class="mut">للبروجكتور أو الشاشة الكبيرة</span></button>
        <button class="role" data-go="host" id="hostbtn"><span class="ic">🎛️</span><b>لوحة المشرف</b><span class="mut">إنشاء الغرفة وإدارة المسابقة</span></button>
      </div><div class="note" style="margin-top:18px" id="lnote"></div></div></div>`;
    $$('[data-go]', root).forEach(b => b.onclick = () => { SFX.unlock(); route(b.dataset.go); });
    try { const u = window.claude && await Promise.race([window.claude.use('user'), new Promise(r => setTimeout(() => r(null), 4000))]); if (u && !u.canEdit()) { $('#hostbtn').style.opacity = .45; $('#lnote').textContent = 'لوحة المشرف متاحة لمالك الصفحة ومحرريها فقط.'; } } catch (e) { }
  }
};

function route(to) {
  const h = (location.hash || '').replace('#', '');
  const r = to || h;
  if (to) { try { history.replaceState(null, '', '#' + (to === 'join' ? 'play' : to)); } catch (e) { } }
  if (r === 'host') return Host.init();
  if (r.startsWith('display')) return Display.init((r.split('-')[1] || '').replace(/\D/g, '').slice(0, 4));
  if (r === 'join' || r === 'play' || r.startsWith('join-')) { const parts = r.split('-'); return Student.init((parts[1] || '').replace(/\D/g, '').slice(0, 4) || null, /^[0-9a-f]{12}$/.test(parts[2] || '') ? parts[2] : null); }
  return Landing.init();
}
Brand.apply();
route();
</script>
