<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ميدان بناء — منصة مسابقات فريق بناء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700;800&display=swap">
<style>:root{--bg:#04141A;--bg2:#0A2028;--mint:#DCF5E2;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--tx:#F3F6FF;--mut:#9AA6C2;--brand:#22A391;--brand2:#A3D68F;--ok:#22C55E;--bad:#EF4444;--warn:#F59E0B;--r:18px;--fh:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;--fb:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased}
body{direction:rtl;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.h{font-family:var(--fh)}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;transition:transform .08s,background .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:transparent;color:#04110F}
.btn.gold{background:var(--brand2);color:#1A1203;border-color:transparent}
.btn.ok{background:var(--ok);color:#03140A;border-color:transparent}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn.big{padding:16px 22px;font-size:18px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.in{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:600;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.dot.warn{background:var(--warn)}
.dot.off{background:var(--bad)}
.note{font-size:13px;color:var(--mut);line-height:1.7}
.warnbox{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.infobox{background:rgba(25,184,166,.1);border:1px solid rgba(25,184,166,.35);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 85% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%),radial-gradient(800px 600px at 0% 110%,color-mix(in srgb,var(--brand2) 14%,transparent),transparent 60%)}
#app{position:relative;z-index:1;min-height:100%}
.logo-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.wordmark{font-family:var(--fh);font-weight:800;letter-spacing:-.5px}
.wordmark b{color:var(--brand)}

/* ===== بوابة الدخول ===== */
.landing{min-height:100vh;display:grid;place-items:center;padding:24px}
.landing .box{width:min(980px,100%)}
.landing h1{font-family:var(--fh);font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.1}
.landing h1 span{color:var(--brand)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.role{text-align:right;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.2s;display:flex;flex-direction:column;gap:8px}
.role:hover{border-color:var(--brand);transform:translateY(-2px)}
.role .ic{font-size:34px}
.role b{font-family:var(--fh);font-size:20px}
@media(max-width:760px){.roles{grid-template-columns:1fr}}

/* ===== لوحة المشرف ===== */
.host{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(7,11,22,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:18px}
.hbar .brand .lg{width:36px;height:36px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--card2)}
.code-badge{font-family:var(--fh);font-weight:800;font-size:20px;letter-spacing:4px;padding:4px 12px;border-radius:10px;background:var(--brand2);color:#1A1203;direction:ltr}
.hmain{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:14px;padding:14px}
@media(max-width:1100px){.hmain{grid-template-columns:1fr}}
.deck{display:flex;flex-direction:column;gap:12px}
.deck .q{font-family:var(--fh);font-size:22px;line-height:1.5;font-weight:700}
.ans-secret{background:rgba(34,197,94,.12);border:1px dashed rgba(34,197,94,.6);border-radius:12px;padding:10px 12px;font-weight:700}
.ans-secret small{display:block;font-weight:400;color:var(--mut);margin-top:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.preview{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.preview .stage-wrap{position:absolute;inset:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.tab{padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.tab.on{background:var(--card2);color:var(--tx)}
.tcard{border-radius:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--tc)}
.tcard .sc{font-family:var(--fh);font-size:30px;font-weight:800}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--brand));border-radius:9px;transition:width .4s}
.cards-row{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.chipbtn.armed{background:var(--brand2);color:#1A1203}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl th{color:var(--mut);font-weight:600;font-size:12px}
.scroll{max-height:420px;overflow:auto}
.sched{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.sched .s{flex:1 0 auto;min-width:74px;padding:6px 8px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:pointer}
.sched .s.cur{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,transparent)}
.sched .s.past{opacity:.5}
.timerbox{font-family:var(--fh);font-size:34px;font-weight:800;direction:ltr;min-width:90px;text-align:center}
.member{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:9px;background:var(--card);font-size:13px}
.member.quiet{outline:1px dashed var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:20px}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.seg-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seg-pick .g{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:right;font-size:13px}
.seg-pick .g b{display:block;font-size:15px;margin-bottom:3px}
.boxgrid-h{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boxgrid-h button{aspect-ratio:2/1;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-family:var(--fh);font-size:20px}
.boxgrid-h button.op{opacity:.35}

/* ===== المسرح (شاشة العرض) — مساحة منطقية 1920×1080 ===== */
.stage-host{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:var(--fb);background:radial-gradient(1200px 800px at 80% -10%,color-mix(in srgb,var(--brand) 26%,transparent),transparent 60%),radial-gradient(1000px 700px at 0% 110%,color-mix(in srgb,var(--brand2) 16%,transparent),transparent 60%),var(--bg)}
.stage .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%)}
.st-top{position:absolute;top:28px;right:56px;left:56px;display:flex;align-items:center;gap:24px;height:120px}
.st-logo{height:120px;max-width:300px;display:flex;align-items:center}
.st-title{font-family:var(--fh);font-weight:800;font-size:40px}
.st-seg{margin-inline-start:auto;display:flex;align-items:center;gap:16px;font-family:var(--fh);font-size:34px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:12px 26px;border-radius:999px}
.st-seg small{font-size:24px;color:var(--mut);font-weight:500}
.st-main{position:absolute;top:170px;bottom:200px;right:56px;left:56px;display:flex;flex-direction:column;justify-content:center}
.st-foot{position:absolute;bottom:32px;right:56px;left:56px;height:140px}
.sb{position:relative;height:140px}
.sb .tm{position:absolute;top:0;height:140px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px;transition:transform .8s cubic-bezier(.2,.8,.2,1),box-shadow .3s;overflow:hidden}
.sb .tm::before{content:'';position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tc) 22%,transparent));pointer-events:none}
.sb .tm .sw{width:16px;align-self:stretch;margin:22px 0;border-radius:9px;background:var(--tc)}
.sb .tm .nm{font-family:var(--fh);font-size:36px;font-weight:700}
.sb .tm .pt{font-family:var(--fh);font-size:64px;font-weight:800;margin-inline-start:auto;direction:ltr;font-variant-numeric:tabular-nums}
.sb .tm .rk{position:absolute;top:10px;left:16px;font-size:22px;color:var(--mut);font-weight:700}
.sb .tm .ic{font-size:26px;display:flex;gap:4px}
.sb .tm.lead{box-shadow:0 0 0 3px var(--brand2),0 0 40px color-mix(in srgb,var(--brand2) 40%,transparent)}
.sb .tm.hit{animation:pulse .9s}
@keyframes pulse{0%{transform:var(--tx0) scale(1)}35%{transform:var(--tx0) scale(1.06)}100%{transform:var(--tx0) scale(1)}}
.delta{position:absolute;top:-34px;font-family:var(--fh);font-size:44px;font-weight:800;color:var(--ok);animation:floatUp 1.8s forwards}
.delta.neg{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px)}15%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.big-q{font-family:var(--fh);font-size:64px;font-weight:700;line-height:1.35;text-align:center;max-width:1600px;margin:0 auto;text-wrap:balance}
.big-q.sm{font-size:52px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.choice{position:relative;display:flex;align-items:center;gap:22px;padding:26px 30px;border-radius:24px;background:var(--card);border:2px solid var(--line);font-family:var(--fh);font-size:42px;font-weight:600;overflow:hidden;transition:.4s}
.choice .L{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;background:var(--card2);font-weight:800;flex:none}
.choice.ok{border-color:var(--ok);background:rgba(34,197,94,.18)}
.choice.ok .L{background:var(--ok);color:#04130A}
.choice.dim{opacity:.35}
.choice .dist{position:absolute;inset:auto 0 0 0;height:8px;background:rgba(255,255,255,.2)}
.choice .dist i{display:block;height:100%;background:var(--brand2)}
.choice .cnt{margin-inline-start:auto;font-size:30px;color:var(--mut)}
.ring{position:absolute;top:150px;left:56px;width:170px;height:170px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fh);font-size:64px;font-weight:800;direction:ltr}
.ring .lbl{position:absolute;bottom:-34px;width:100%;text-align:center;color:var(--mut);font-size:22px}
.ring.low .num{color:var(--bad);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.buzz-banner{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.buzz-banner .bb{padding:40px 80px;border-radius:40px;background:var(--tc);color:#fff;text-align:center;box-shadow:0 30px 120px color-mix(in srgb,var(--tc) 60%,transparent);animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
.buzz-banner .bb .t{font-family:var(--fh);font-size:96px;font-weight:800;line-height:1.1}
.buzz-banner .bb .s{font-size:44px;font-weight:600;opacity:.95}
@keyframes slam{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.mini-bz{display:inline-flex;align-items:center;gap:16px;padding:16px 30px;border-radius:999px;background:var(--tc);font-family:var(--fh);font-size:40px;font-weight:800;color:#fff;margin:0 auto}
.status-line{text-align:center;margin-top:30px;font-size:34px;color:var(--mut);font-family:var(--fh)}
.status-line b{color:var(--tx)}
.flash{position:absolute;inset:0;pointer-events:none;z-index:8}
.flash.ok{animation:flashOk .8s}
.flash.bad{animation:flashBad .8s}
@keyframes flashOk{0%{background:rgba(34,197,94,.35)}100%{background:transparent}}
@keyframes flashBad{0%{background:rgba(239,68,68,.35)}100%{background:transparent}}
.intro{text-align:center}
.intro .ico{font-size:160px;line-height:1;animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.intro .nm{font-family:var(--fh);font-size:120px;font-weight:800;margin-top:20px;animation:rise .7s .1s both}
.intro .ds{font-size:40px;color:var(--mut);max-width:1400px;margin:24px auto 0;line-height:1.6;animation:rise .7s .25s both}
.intro .md{margin-top:30px;display:inline-flex;gap:14px;font-size:30px;padding:12px 26px;border-radius:99px;background:var(--card2);animation:rise .7s .35s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.vs{display:flex;align-items:center;justify-content:center;gap:40px;margin-bottom:34px}
.vs .side{padding:16px 40px;border-radius:22px;background:var(--tc);font-family:var(--fh);font-size:48px;font-weight:800;color:#fff;min-width:360px;text-align:center}
.vs .side small{display:block;font-size:28px;font-weight:600;opacity:.9}
.vs .x{font-family:var(--fh);font-size:84px;font-weight:900;color:var(--brand2);animation:pop .6s}
.vs .side.lk{opacity:.35;filter:grayscale(.6)}
.grid9{display:grid;grid-template-columns:repeat(3,210px);gap:24px;justify-content:center}
.grid9 div{height:210px;border-radius:28px;background:var(--card2);display:grid;place-items:center;font-size:120px;animation:pop .4s both}
.clues{display:flex;flex-direction:column;gap:18px;max-width:1500px;margin:30px auto 0;width:100%}
.clue{padding:22px 32px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:42px;font-family:var(--fh);animation:rise .5s both;display:flex;gap:20px;align-items:center}
.clue .n{width:60px;height:60px;border-radius:50%;background:var(--brand);color:#03110F;display:grid;place-items:center;font-weight:800;flex:none}
.reveal-box{margin:36px auto 0;padding:24px 50px;border-radius:26px;background:rgba(34,197,94,.16);border:2px solid var(--ok);font-family:var(--fh);font-size:64px;font-weight:800;text-align:center;animation:pop .5s}
.reveal-box small{display:block;font-size:26px;font-weight:500;color:var(--mut);margin-top:8px}
.team-res{display:flex;gap:20px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.team-res .r{min-width:300px;padding:18px 26px;border-radius:22px;background:var(--card);border-top:6px solid var(--tc);text-align:center}
.team-res .r b{display:block;font-family:var(--fh);font-size:34px}
.team-res .r .p{font-family:var(--fh);font-size:56px;font-weight:800;color:var(--ok);direction:ltr}
.team-res .r .s{font-size:24px;color:var(--mut)}
.ans-prog{display:flex;justify-content:center;gap:22px;margin-top:40px}
.ans-prog .a{padding:12px 26px;border-radius:99px;background:var(--card2);font-size:30px;font-family:var(--fh);border-bottom:5px solid var(--tc)}
.wheel-wrap{display:flex;align-items:center;justify-content:center;gap:80px}
.wheel{position:relative;width:640px;height:640px}
.wheel svg{width:100%;height:100%;transition:transform 5.2s cubic-bezier(.12,.75,.12,1)}
.wheel .ptr{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:56px solid var(--brand2);filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));z-index:2}
.wheel .hub{position:absolute;inset:0;margin:auto;width:110px;height:110px;border-radius:50%;background:var(--bg2);border:6px solid var(--brand2);display:grid;place-items:center;font-size:44px}
.wres{max-width:700px;font-family:var(--fh)}
.wres .t{font-size:62px;font-weight:800;line-height:1.3;animation:pop .5s}
.boxes{display:grid;grid-template-columns:repeat(3,330px);gap:28px;justify-content:center}
.boxes .bx{height:190px;border-radius:28px;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 60%,#111),color-mix(in srgb,var(--brand) 25%,#000));display:grid;place-items:center;font-family:var(--fh);font-size:80px;font-weight:800;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.boxes .bx.op{background:var(--card);font-size:30px;padding:14px;text-align:center;line-height:1.35;border-top:8px solid var(--tc);animation:flip .6s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:30px;height:640px}
.podium .p{width:340px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 80%,#fff 0%),color-mix(in srgb,var(--tc) 40%,#000));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:30px;color:#fff;animation:grow 1s cubic-bezier(.2,.9,.2,1) both;transform-origin:bottom}
.podium .p .n{font-family:var(--fh);font-size:46px;font-weight:800}
.podium .p .s{font-family:var(--fh);font-size:70px;font-weight:900;direction:ltr}
.podium .p .k{font-size:90px}
@keyframes grow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.winner{text-align:center}
.winner .cr{font-size:180px;animation:pop .8s}
.winner .n{font-family:var(--fh);font-size:150px;font-weight:900;color:var(--tc);text-shadow:0 0 60px color-mix(in srgb,var(--tc) 60%,transparent);animation:pop .8s .2s both}
.winner .s{font-family:var(--fh);font-size:60px;font-weight:700;animation:rise .6s .5s both}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-30px;width:16px;height:26px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1200px) rotate(720deg)}}
.lobby{display:grid;grid-template-columns:1fr 560px;gap:60px;align-items:center}
.lobby .qr{background:#fff;border-radius:30px;padding:28px;width:520px;height:520px;display:grid;place-items:center}
.lobby .qr svg,.lobby .qr img{width:100%;height:100%}
.lobby h2{font-family:var(--fh);font-size:110px;font-weight:900;line-height:1.05}
.lobby h2 span{color:var(--brand)}

.teams-in .t.wait{opacity:.12;animation:none;background:var(--card);box-shadow:none}
@keyframes slideIn{0%{transform:translateY(200px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.rules .r{padding:30px;border-radius:26px;background:var(--card);border:1px solid var(--line);font-size:32px;line-height:1.55}
.rules .r b{display:block;font-family:var(--fh);font-size:40px;margin-bottom:10px;color:var(--brand2)}
.welcome{text-align:center}
.welcome .lg{height:440px;display:flex;justify-content:center;margin-bottom:30px;animation:pop 1s}

.order-list .o{display:flex;gap:22px;align-items:center;padding:20px 30px;border-radius:22px;background:var(--card);font-family:var(--fh);font-size:42px}
.order-list .o .n{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--card2);font-weight:800}
.order-list .o.ok .n{background:var(--ok);color:#03140A}
.fx-low .delta,.fx-low .confetti{display:none}

.pl-head .nm{font-family:var(--fh);font-size:18px}
.pl-head .sc{margin-inline-start:auto;font-family:var(--fh);font-size:22px;font-weight:800;direction:ltr}
.pl-body{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.pl-q{font-family:var(--fh);font-size:21px;font-weight:700;line-height:1.55;text-align:center}
.pl-choices{display:grid;gap:10px}
.pl-choices button{padding:18px;border-radius:16px;background:var(--card2);border:2px solid var(--line);font-size:19px;font-weight:700;text-align:right;display:flex;gap:12px;align-items:center}
.pl-choices button .L{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.pl-choices button.sel{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 22%,transparent)}
.pl-choices button.ok{border-color:var(--ok);background:rgba(34,197,94,.2)}
.pl-choices button.no{border-color:var(--bad);background:rgba(239,68,68,.18)}
.buzzer{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e11d48 55%,#9f1239);box-shadow:0 14px 0 #7f1031,0 24px 50px rgba(225,29,72,.5);font-family:var(--fh);font-size:44px;font-weight:900;color:#fff;transition:transform .06s,box-shadow .06s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.buzzer:active,.buzzer.pressed{transform:translateY(12px);box-shadow:0 2px 0 #7f1031,0 10px 30px rgba(225,29,72,.5)}
.buzzer:disabled{background:radial-gradient(circle at 35% 30%,#888,#555 55%,#333);box-shadow:0 14px 0 #222;opacity:.6}
.pl-state{text-align:center;padding:18px;border-radius:16px;background:var(--card);font-size:18px;line-height:1.7}
.pl-state.big{font-family:var(--fh);font-size:26px;font-weight:800}
.pl-state.win{background:rgba(34,197,94,.18);border:2px solid var(--ok)}
.pl-state.lose{background:rgba(239,68,68,.14);border:2px solid var(--bad)}
.pl-mini{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pl-mini span{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--card);border-bottom:3px solid var(--tc)}
.pl-mission{border-radius:14px;padding:12px;background:rgba(244,183,64,.12);border:1px dashed var(--brand2);font-size:14px;line-height:1.7}
.pl-timer{font-family:var(--fh);font-size:30px;font-weight:800;text-align:center;direction:ltr}
.taboo-card{border-radius:20px;padding:24px;background:var(--card2);text-align:center}
.taboo-card .w{font-family:var(--fh);font-size:44px;font-weight:900;color:var(--brand2)}
.taboo-card .b{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.taboo-card .b span{padding:6px 12px;border-radius:99px;background:rgba(239,68,68,.2);color:#fecaca;font-weight:700;text-decoration:line-through}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teampick button{padding:16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:18px;border-bottom:5px solid var(--tc)}
.teampick button.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 25%,transparent)}
.netbar{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px}

.battle{display:grid;grid-template-columns:520px 1fr;gap:40px;align-items:center}
.vs-list{display:flex;flex-direction:column;gap:20px}

.vrow.win .res{color:var(--ok)}
.vrow.hold .res{color:var(--brand2)}
.bgrids{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:26px}
.bgrid{background:var(--card);border-radius:24px;padding:16px;border-top:8px solid var(--tc);text-align:center}

.bgrid.own{opacity:.45}
.bgrid .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.bgrid .cell.sh{background:rgba(163,214,143,.25)}
.bgrid .cell.boom{animation:boom 1s}

.term{margin-inline-end:200px;background:#020a06;border:2px solid #1f6f4a;border-radius:24px;padding:30px 40px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#5CFF9D;box-shadow:0 0 60px rgba(92,255,157,.15) inset}
.term .tl div{font-size:34px;line-height:1.6;animation:rise .4s both;direction:rtl}
.tteams{display:grid;gap:14px;margin-top:22px}
.tt{display:flex;gap:24px;align-items:center;padding:14px 22px;border-radius:14px;background:rgba(92,255,157,.06);border-inline-start:10px solid var(--tc);font-size:32px;font-family:var(--fh);color:#d8ffe8}

.tt.ok{background:rgba(92,255,157,.18)}
.tt.lk{background:rgba(239,68,68,.15)}
.draw{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:22px}
.draw .dc{background:var(--card);border-radius:24px;border-top:10px solid var(--tc);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.draw .dc b{font-family:var(--fh);font-size:44px;color:var(--tc);filter:brightness(1.3)}
.draw .dc span{font-size:30px;padding:6px 18px;border-radius:99px;background:color-mix(in srgb,var(--tc) 25%,transparent);animation:pop .5s both}
.pl-vil{background:var(--card);border-radius:16px;padding:6px}
.pl-term{background:#020a06;border:1px solid #1f6f4a;border-radius:14px;padding:14px;font-family:ui-monospace,Menlo,monospace;color:#5CFF9D;font-size:16px;line-height:1.8}
.pl-bgrid{background:var(--card);border-radius:14px;padding:10px;border-top:5px solid var(--tc)}
.pl-bgrid b{display:block;text-align:center;margin-bottom:6px}
.pl-bgrid>div{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.hcells button{padding:8px 0;border-radius:8px;background:var(--card2);font-weight:700;font-size:13px}
.hcells button.hit{opacity:.35}

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

<script>/* ===== محرك ميدان بناء =====
   منطق المسابقة كاملًا بلا واجهة: الجولات، الاستباق، النقاط، المشاركة.
   يعمل في متصفح المشرف فقط، وهو المرجع الوحيد للنتائج. */
(function (root) {
  const TEAM_COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#A855F7'];
  const TEAM_NAMES = ['الوفاء', 'النماء', 'الإخاء', 'العطاء'];
  const BASE_BY_D = { 1: 10, 2: 20, 3: 30 };
  const WHO_PTS = [40, 30, 20, 10];
  const LIVE_PTS = [20, 15, 10, 5];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

  class Engine {
    constructor(DATA, opts = {}) {
      this.D = DATA;
      this.rng = opts.rng || Math.random;
      this.now = opts.now || (() => Date.now());
      this.onChange = () => {};
      this.s = opts.state ? opts.state : this.freshState(opts);
      this.buildBank(opts.custom || [], opts.disabled || []);
    }

    // ---------- الحالة ----------
    freshState(opts = {}) {
      const n = opts.teamCount || 4;
      const teams = [];
      for (let i = 0; i < n; i++) teams.push({ id: 't' + (i + 1), name: TEAM_NAMES[i] || ('فريق ' + (i + 1)), color: TEAM_COLORS[i] || '#888' });
      const s = {
        ver: 1, v: 0, code: opts.code || this.makeCode(), title: 'ميدان بناء', createdAt: this.now(),
        settings: { allowTeamChoice: true, buzzPenalty: 0, answerTime: 10, fx: 'high', autoSecret: true, minutes: 60, village: true, drawInOpening: true },
        teams, students: {}, banned: {}, ledger: [], txSeq: 0,
        cards: {}, armed: {}, frozen: {}, streak: {}, missions: {}, village: {}, bomb: null, honors: {},
        plan: clone(this.D.DEFAULT_PLAN), planIdx: -1, clock: { startedAt: null, segStart: null },
        seg: null, seq: 0, used: {}, timer: null, fx: { n: 0, k: null }, undo: [], leader: null, ended: false
      };
      teams.forEach(t => this.initTeam(s, t.id));
      return s;
    }
    initTeam(s, id) { s.cards[id] = { double: 1, shield: 1, freeze: 1 }; s.armed[id] = { double: false, shield: false }; s.streak[id] = 0; if (!s.village) s.village = {}; if (!s.village[id]) s.village[id] = { gold: 0, earned: 0, b: { wall: 0, tower: 0, barracks: 0, catapult: 0 } }; }
    makeCode() { let c = ''; for (let i = 0; i < 4; i++) c += Math.floor(this.rng() * 10); return c === '0000' ? '1357' : c; }
    touch(fxKind, fxData) { this.s.v++; if (fxKind) this.s.fx = { n: this.s.fx.n + 1, k: fxKind, d: fxData || null }; this.onChange(this.s); }
    pick(arr) { return arr[Math.floor(this.rng() * arr.length)]; }
    shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    team(id) { return this.s.teams.find(t => t.id === id); }

    // ---------- بنك الأسئلة ----------
    buildBank(custom, disabled) {
      const D = this.D, B = [];
      D.MCQ.forEach((m, i) => B.push({ id: 'm' + i, kind: 'mcq', cat: m[0], d: m[1], q: m[2], c: m[3], src: m[4] || '' }));
      D.TF.forEach((m, i) => B.push({ id: 'f' + i, kind: 'tf', cat: 'general', d: 1, q: m[0], a: m[1] }));
      D.ORDER.forEach((m, i) => B.push({ id: 'o' + i, kind: 'order', cat: m[0], d: m[1], q: m[2], c: m[3] }));
      D.WHOAMI.forEach((m, i) => B.push({ id: 'w' + i, kind: 'whoami', cat: m[0], d: 2, q: 'من أنا؟', a: m[1], clues: m[2] }));
      D.CIPHER.forEach((m, i) => B.push({ id: 'c' + i, kind: 'open', cat: 'logic', d: m[3], q: m[0], a: m[1], hint: m[2] }));
      D.ESTIMATE.forEach((m, i) => B.push({ id: 'e' + i, kind: 'number', cat: 'general', d: 2, q: m[0], a: m[1], unit: m[2] }));
      D.CONSENSUS.forEach((m, i) => B.push({ id: 'n' + i, kind: 'consensus', cat: 'fun', d: 1, q: m[0], c: m[1] }));
      D.TABOO.forEach((m, i) => B.push({ id: 'b' + i, kind: 'taboo', cat: 'arabic', d: 1, q: m[0], c: m[1] }));
      D.LIVE.forEach((m, i) => B.push({ id: 'l' + i, kind: 'live', cat: 'fun', d: 1, q: m[0], a: m[1], time: m[2] }));
      (D.VAULT || []).forEach((m, i) => B.push({ id: 'v' + i, kind: 'vault', cat: 'logic', d: 2, q: 'رمز الخزنة', a: m[0], clues: m[1] }));
      (custom || []).forEach(c => B.push(Object.assign({ custom: true }, c)));
      const dis = new Set(disabled || []);
      this.bank = B.filter(b => !dis.has(b.id));
      this.allBank = B;
    }

    // ---------- المهام السرية ----------

    // ---------- البرنامج والجولات ----------

    // الانتقال إلى البند التالي داخل الجولة

    // فتح السؤال للإجابة/الاستباق

    revealClue() { const it = this.item(); if (it && it.kind === 'whoami' && it.clue < it.clues.length - 1) { it.clue++; this.touch('clue'); } }

    // ---------- الاستباق ----------
    canBuzz(sid) {
      const s = this.s, seg = s.seg, it = this.item(), st = s.students[sid];
      if (!seg || !it || !st || seg.mode !== 'buzz' || seg.phase !== 'open' || it.buzz) return false;

      if (it.reps && it.reps.length && !it.reps.includes(sid)) return false;
      return true;
    }
    // الخادم المرجعي هنا هو متصفح المشرف: أول ضغطة تصل وتُعالج تُعتمد
    buzz(sid, qid) {
      const s = this.s, it = this.item(), st = s.students[sid];

      st.st.lastAct = s.seq;
      if (!this.canBuzz(sid)) {
        if (it.buzz && it.late.length < 5 && !it.late.find(l => l.sid === sid) && it.buzz.sid !== sid) { it.late.push({ sid, dt: this.now() - it.buzz.at }); this.touch(); }
        return { ok: false, why: 'closed' };
      }

    }
    // للمشرف: منح الأولوية يدويًا (وضع الطوارئ أو المشاركة الشفهية)

      const s = this.s, seg = s.seg, it = this.item();

      if (seg.phase === 'ready') { seg.phase = 'open'; it.openedAt = this.now(); }

    }
    itemPoints(it) {

      return (BASE_BY_D[it.d] || 20) * (seg.mult || 1);
    }
    judge(correct) {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || !it.buzz || seg.phase !== 'answering') return;
      const tid = it.buzz.team, st = it.buzz.sid ? s.students[it.buzz.sid] : null;
      const tx = this.beginTx(correct ? 'إجابة صحيحة' : 'إجابة خاطئة');
      if (correct) {
        const pts = this.itemPoints(it);
        this.award(tid, pts, this.segName(seg.g) + ': إجابة صحيحة' + (st ? ' — ' + st.name : ''), tx);
        if (st) { st.st.ok++; st.st.win++; }
        s.streak[tid] = (s.streak[tid] || 0) + 1;
        Object.keys(s.streak).forEach(k => { if (k !== tid) s.streak[k] = 0; });
        if (s.streak[tid] >= 3) { this.award(tid, 5, 'سلسلة انتصارات (3 متتالية)', tx); s.streak[tid] = 0; it.streakBonus = true; }
        it.result = { team: tid, ok: true }; it.revealed = true; seg.phase = 'reveal'; s.timer = null;
        if (s.frozen && it.eligible) it.eligible.forEach(t => { if (s.frozen[t]) delete s.frozen[t]; });
        if ((this.gameDef(seg.g) || {}).bomb && this.canTarget(tid)) { seg.phase = 'aim'; it.shooter = { team: tid, sid: it.buzz.sid }; it.shots = 1 + (this.vil(tid).b.catapult >= 2 ? 1 : 0); it.shotLog = []; this.startTimer(25, 'اختر هدفك'); }
        this.afterScore();
        this.touch('correct', { team: tid });
      } else {
        const pen = s.settings.buzzPenalty || 0;
        if (pen) this.award(tid, -pen, this.segName(seg.g) + ': إجابة خاطئة', tx);
        s.streak[tid] = 0;
        it.locked.push(tid);
        it.buzz = null;
        const remainingTeams = it.eligible.filter(t => !it.locked.includes(t) && !s.frozen[t]);
        if (!remainingTeams.length) { it.result = { team: null, ok: false }; it.revealed = true; seg.phase = 'reveal'; s.timer = null; this.afterScore(); this.touch('wrong', { team: tid, final: true }); }
        else { seg.phase = 'paused'; s.timer = null; this.afterScore(); this.touch('wrong', { team: tid }); }
      }
    }
    // إعادة فتح الاستباق للفرق المتبقية بعد خطأ
    reopen() {
      const seg = this.s.seg, it = this.item(); if (!it || seg.phase !== 'paused') return;
      seg.phase = 'open'; it.bo = (it.bo || 0) + 1; this.startTimer(Math.max(8, Math.round(((this.gameDef(seg.g) || {}).time || 15) / 2)), 'الاستباق مفتوح للبقية');
      this.touch('open');
    }
    revealItem(timeout) {

      if (s.frozen && it.eligible) it.eligible.forEach(t => { if (s.frozen[t]) delete s.frozen[t]; });
      this.touch(timeout ? 'timeup' : 'reveal');
    }

    // ---------- الإجابة الفردية من الجوالات ----------
    answer(sid, qid, v) {
      const s = this.s, seg = s.seg, it = this.item(), st = s.students[sid];
      if (!it || !st || it.qid !== qid || seg.mode !== 'all' || seg.phase !== 'open') return false;
      if (it.answers[sid] !== undefined) return false;
      if (seg.g === 'survival' && seg.alive && !(sid in seg.alive)) return false;
      if (it.kind === 'accuse') { const tg = s.students[v]; if (typeof v !== 'string' || !tg || tg.team !== st.team || v === sid) return false; }
      else if (!this.validAnswer(it, v)) return false;
      it.answers[sid] = { v, t: this.now() - (it.openedAt || this.now()) };
      st.st.ans++; st.st.lastAct = s.seq;
      this.touch();
      return true;
    }
    // تصويت الجمهور في التحدي الحضوري
    vote(sid, qid, tid) {
      const s = this.s, seg = s.seg, it = this.item(), st = s.students[sid];
      if (!it || !st || it.qid !== qid || it.kind !== 'live' || seg.phase !== 'vote' || it.votes[sid] || tid === st.team || !this.team(tid)) return false;
      it.votes[sid] = tid; st.st.lastAct = s.seq; this.touch(); return true;
    }
    validAnswer(it, v) {
      if (it.kind === 'mcq' || it.kind === 'tf' || it.kind === 'consensus' || it.kind === 'council') return Number.isInteger(v) && v >= 0 && v < it.c.length;
      if (it.kind === 'order') return Array.isArray(v) && v.length === it.c.length && new Set(v).size === v.length && v.every(x => Number.isInteger(x) && x >= 0 && x < it.c.length);
      if (it.kind === 'number') return typeof v === 'number' && isFinite(v) && Math.abs(v) < 1e12;
      return false;
    }
    isCorrect(it, v) { if (it.kind === 'order') return JSON.stringify(v) === JSON.stringify(it.a); return v === it.a; }
    answerCounts() { const it = this.item(); if (!it || !it.answers) return { n: 0, byTeam: {} }; const byTeam = {}; Object.keys(it.answers).forEach(sid => { const st = this.s.students[sid]; if (st) byTeam[st.team] = (byTeam[st.team] || 0) + 1; }); return { n: Object.keys(it.answers).length, byTeam }; }
    lockAll() {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || seg.phase !== 'open') return;
      s.timer = null; seg.phase = 'reveal'; it.revealed = true;
      const def = this.gameDef(seg.g) || {}; const base = (def.base || 20) * (seg.mult || 1);
      const tx = this.beginTx(this.segName(seg.g));
      const res = {}; s.teams.forEach(t => { res[t.id] = { ok: 0, n: 0, pts: 0 }; });
      const per = Object.entries(it.answers).map(([sid, a]) => ({ sid, st: s.students[sid], a })).filter(x => x.st);
      if (it.kind === 'council') {
        const B = Object.keys(this.D.BUILD);
        s.teams.forEach(t => {
          const vals = per.filter(x => x.st.team === t.id).map(x => x.a.v); res[t.id].n = vals.length; res[t.id].built = [];
          const cnt = {}; vals.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; });
          const order = Object.keys(cnt).map(Number).filter(v => v < B.length).sort((a, b) => (cnt[b] - cnt[a]) || ((this.buildCost(t.id, B[a]) || 999) - (this.buildCost(t.id, B[b]) || 999)));
          order.forEach(v => { const key = B[v], c = this.buildCost(t.id, key); if (c != null && this.doUpgrade(t.id, key)) { res[t.id].built.push(key); s.ledger.push({ tx, t: this.now(), team: t.id, d: 0, why: 'مجلس القرية: بنى ' + this.D.BUILD[key].name + ' (المستوى ' + this.vil(t.id).b[key] + ') بـ' + c + ' ذهب' }); } });
          res[t.id].votes = cnt;
        });
      } else if (it.kind === 'accuse') {
        s.teams.forEach(t => {
          const sab = seg.sab && seg.sab[t.id]; const vals = per.filter(x => x.st.team === t.id).map(x => x.a.v); const cnt = {}; vals.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; });
          const mx = vals.length ? Math.max(...Object.values(cnt)) : 0; const tops = Object.keys(cnt).filter(k => cnt[k] === mx); const accused = tops.length === 1 ? tops[0] : null;
          const caught = !!sab && accused === sab; const nm = id => (s.students[id] || {}).name || '';
          res[t.id] = { n: vals.length, accused: accused ? nm(accused) : null, sab: sab ? nm(sab) : null, caught, pts: 0 };
          if (caught) res[t.id].pts = this.award(t.id, 25, 'الاتهام: كشفوا المخرّب', tx); else if (sab) { s.honors[sab] = (s.honors[sab] || 0) + 1; }
        });
      } else if (seg.g === 'traitor' && it.kind === 'mcq') {
        s.teams.forEach(t => {
          const vals = per.filter(x => x.st.team === t.id).map(x => x.a.v); res[t.id].n = vals.length; if (!vals.length) return;
          const cnt = {}; vals.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; }); const mx = Math.max(...Object.values(cnt)); const tops = Object.keys(cnt).filter(k => cnt[k] === mx);
          const pick = tops.length === 1 ? +tops[0] : null; res[t.id].pick = pick; res[t.id].ok = pick === it.a;
          if (res[t.id].ok) res[t.id].pts = this.award(t.id, BASE_BY_D[it.d] || 20, 'الاتهام: رأي أغلبية الفريق صحيح', tx);
        });

      } else if (it.kind === 'number') {

        s.teams.forEach(t => { const vals = per.filter(x => x.st.team === t.id).map(x => x.a.v); res[t.id].n = vals.length; meds[t.id] = median(vals); res[t.id].med = meds[t.id]; });
        const ranked = s.teams.filter(t => meds[t.id] != null).map(t => ({ id: t.id, diff: Math.abs(meds[t.id] - it.a) })).sort((a, b) => a.diff - b.diff);
        if (ranked.length) {

          firsts.forEach(r => { res[r.id].pts = this.award(r.id, 20, 'الرقم الأقرب: الأقرب للإجابة', tx); });
          const rest = ranked.filter(r => r.diff > best); if (rest.length) { const b2 = rest[0].diff; rest.filter(r => r.diff === b2).forEach(r => { res[r.id].pts = this.award(r.id, 10, 'الرقم الأقرب: المركز الثاني', tx); }); }
        }
        if (per.length) { per.sort((x, y) => Math.abs(x.a.v - it.a) - Math.abs(y.a.v - it.a)); const top = per[0]; top.st.st.ok++; it.bestSid = top.sid; }
      } else if (it.kind === 'consensus') {
        s.teams.forEach(t => {
          const vals = per.filter(x => x.st.team === t.id).map(x => x.a.v); res[t.id].n = vals.length;
          if (vals.length >= 2) { const cnt = {}; vals.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; }); const mx = Math.max(...Object.values(cnt)); const ratio = mx / vals.length; res[t.id].ratio = ratio; const pts = Math.round(15 * ratio); if (pts) res[t.id].pts = this.award(t.id, pts, 'عقل واحد: توافق ' + Math.round(ratio * 100) + '%', tx); }
        });
      } else {
        per.forEach(x => { const ok = this.isCorrect(it, x.a.v); res[x.st.team].n++; if (ok) { res[x.st.team].ok++; x.st.st.ok++; } x.ok = ok; });

        } else {

          const fastest = per.filter(x => x.ok).sort((a, b) => a.a.t - b.a.t)[0]; if (fastest) it.fastest = fastest.sid;
        }
      }
      it.result = res;
      it.dist = it.c && it.kind !== 'accuse' ? it.c.map((_, i) => per.filter(x => JSON.stringify(x.a.v) === JSON.stringify(i)).length) : null;
      this.afterScore();
      this.touch('reveal');
    }

    // إجابة الفريق: المشرف يحدد الفرق التي أجابت صحيحًا
    teamMark(tids) {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || (seg.phase !== 'open' && seg.phase !== 'ready')) return;
      const tx = this.beginTx('إجابة الفريق');
      const pts = this.itemPoints(it);
      const res = {}; (tids || []).forEach(t => { res[t] = { pts: this.award(t, pts, this.segName(seg.g) + ': إجابة الفريق', tx) }; });
      it.result = res; it.revealed = true; seg.phase = 'reveal'; s.timer = null;
      this.afterScore(); this.touch('reveal');
    }
    setMode(mode) { const seg = this.s.seg; if (!seg) return; const it = this.item(); if (it && (it.kind === 'open' || it.kind === 'whoami') && mode === 'all') return; seg.mode = mode; this.touch(); }

    // ---------- العجلة والصناديق ----------
    spin() {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || it.kind !== 'wheel' || seg.phase !== 'turn') return;
      const W = this.D.WHEEL; const idx = Math.floor(this.rng() * W.length);
      it.res = { idx, ...W[idx] }; it.spinAt = this.now(); seg.phase = 'spun';
      if (it.repSid && s.students[it.repSid]) { s.students[it.repSid].st.pick++; s.students[it.repSid].st.lastPick = s.seq; s.students[it.repSid].st.lastAct = s.seq; }
      this.touch('spin', { idx });
    }
    openBox(i) {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || it.kind !== 'box' || seg.phase !== 'turn') return;
      const b = seg.boxes[i]; if (!b || b.open) return;
      b.open = true; b.by = it.team; it.res = { ...b, i }; seg.phase = 'spun';
      if (it.repSid && s.students[it.repSid]) { s.students[it.repSid].st.pick++; s.students[it.repSid].st.lastPick = s.seq; s.students[it.repSid].st.lastAct = s.seq; }
      this.touch('box', { i });
    }
    // تطبيق نتيجة العجلة/الصندوق. success للتحديات والأسئلة الخاصة
    applyLuck(success) {
      const s = this.s, seg = s.seg, it = this.item(); if (!it || !it.res || seg.phase !== 'spun') return;
      const r = it.res, tid = it.team, tx = this.beginTx('مفاجأة');
      const why = (it.kind === 'wheel' ? 'عجلة المصير: ' : 'الصناديق: ') + r.t;
      if (r.k === 'pts') this.award(tid, r.v, why, tx);
      else if (r.k === 'all') s.teams.forEach(t => this.award(t.id, r.v, why, tx));
      else if (r.k === 'others') s.teams.forEach(t => { if (t.id !== tid) this.award(t.id, r.v, why, tx); });
      else if (r.k === 'card') { this.giveCard(tid, r.v); s.ledger.push({ tx, t: this.now(), team: tid, d: 0, why }); }
      else if (r.k === 'combo') { this.award(tid, r.v, why, tx); this.giveCard(tid, 'double'); }
      else if (r.k === 'steal') { const L = this.ranking()[0]; if (L && L.id !== tid && L.score >= r.v) { this.award(L.id, -r.v, why + ' (خُصمت)', tx, { raw: true }); this.award(tid, r.v, why, tx, { raw: true }); } }
      else if ((r.k === 'challenge' || r.k === 'question') && success) this.award(tid, r.v, why + ' — نجح', tx);
      it.applied = true; seg.phase = 'reveal';
      this.afterScore();
    }

    // ---------- المزاد ----------
    setBid(tid, v) { const it = this.item(); if (!it || !it.auction || this.s.seg.phase !== 'bidding') return; const sc = this.scores()[tid] || 0; v = Math.max(0, Math.min(30, Math.round(+v || 0), Math.max(0, sc))); it.bids[tid] = v; this.touch(); }
    closeBids() {
      const s = this.s, it = this.item(); if (!it || !it.auction || s.seg.phase !== 'bidding') return;
      const entries = Object.entries(it.bids).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      if (!entries.length) { it.winner = null; s.seg.phase = 'open'; it.eligible = s.teams.map(t => t.id); this.startTimer(20); this.touch('open'); return; }
      const top = entries[0][1]; const tied = entries.filter(e => e[1] === top).map(e => e[0]);
      it.winner = tied.length === 1 ? tied[0] : this.pick(tied); it.bid = top;
      s.seg.phase = 'open'; it.openedAt = this.now(); this.startTimer(20, 'وقت الإجابة'); this.touch('open');
    }
    judgeAuction(correct) {
      const s = this.s, it = this.item(); if (!it || !it.auction || s.seg.phase !== 'open') return;
      const tx = this.beginTx('المزاد');
      if (it.winner) { if (correct) this.award(it.winner, it.bid, 'المزاد: إجابة صحيحة', tx); else this.award(it.winner, -Math.floor(it.bid / 2), 'المزاد: إجابة خاطئة', tx); }
      it.result = { team: it.winner, ok: correct }; it.revealed = true; s.seg.phase = 'reveal'; s.timer = null; this.afterScore(); this.touch(correct ? 'correct' : 'wrong');
    }

    // ---------- رهان الحسم ----------
    maxWager(tid) { const sc = this.scores()[tid] || 0; return Math.max(0, Math.min(40, Math.floor(sc * 0.25))); }
    setWager(tid, v) { const it = this.item(); if (!it || !it.wagerQ || this.s.seg.phase !== 'wager') return; it.wagers[tid] = Math.max(0, Math.min(this.maxWager(tid), Math.round(+v || 0))); this.touch(); }
    lockWagers() { const s = this.s, it = this.item(); if (!it || !it.wagerQ || s.seg.phase !== 'wager') return; s.teams.forEach(t => { if (it.wagers[t.id] == null) it.wagers[t.id] = 0; }); s.seg.phase = 'open'; it.openedAt = this.now(); this.startTimer(30, 'الفرق تكتب إجاباتها'); this.touch('open'); }
    judgeWager(correctTids) {
      const s = this.s, it = this.item(); if (!it || !it.wagerQ || s.seg.phase !== 'open') return;
      const tx = this.beginTx('رهان الحسم'); const res = {};
      s.teams.forEach(t => { const w = it.wagers[t.id] || 0; const ok = correctTids.includes(t.id); res[t.id] = { ok, pts: w ? this.award(t.id, ok ? w : -w, 'رهان الحسم: ' + (ok ? 'صحيح' : 'خطأ'), tx, { raw: true }) : 0 }; });
      it.result = res; it.revealed = true; s.seg.phase = 'reveal'; s.timer = null; this.afterScore(); this.touch('reveal');
    }

    // ---------- الكلمة الممنوعة ----------
    tabooStart() { const s = this.s, it = this.item(); if (!it || it.kind !== 'taboo' || s.seg.phase !== 'turn') return; s.seg.phase = 'open'; const st = s.students[it.rep]; if (st) { st.st.pick++; st.st.lastPick = s.seq; st.st.lastAct = s.seq; } this.startTimer((this.gameDef('taboo').time) || 60, 'الوصف'); this.touch('open'); }
    tabooMark(ok) { const s = this.s, it = this.item(); if (!it || it.kind !== 'taboo' || s.seg.phase !== 'open') return; if (ok) it.got++; it.wi++; if (it.wi >= it.words.length) { this.tabooEnd(); return; } this.touch(ok ? 'tick-ok' : 'skip'); }
    tabooEnd() { const s = this.s, it = this.item(); if (!it || it.kind !== 'taboo' || s.seg.phase !== 'open') return; const tx = this.beginTx('الكلمة الممنوعة'); const pts = Math.min(30, it.got * 5); if (pts) this.award(it.team, pts, 'الكلمة الممنوعة: ' + it.got + ' كلمات', tx); it.result = { pts }; it.revealed = true; s.seg.phase = 'reveal'; s.timer = null; this.afterScore(); this.touch('reveal'); }
    setDuelRep(tid, sid) { const it = this.item(), st = this.s.students[sid]; if (!it || !it.reps || !st || st.team !== tid) return; it.reps = it.reps.filter(x => this.s.students[x] && this.s.students[x].team !== tid); it.reps.push(sid); st.st.pick++; st.st.lastPick = this.s.seq; this.touch(); }

  bindSide() {
    const el = $('#side'), E = this.e;
    $$('[data-set]', el).forEach(x => x.onchange = () => { const k = x.dataset.set; let v = x.type === 'checkbox' ? x.checked : x.value; if (x.type === 'number') v = +v; E.setSetting(k, v); });
    $$('[data-move]', el).forEach(x => x.onchange = () => E.moveStudent(x.dataset.move, x.value));
    const so = $('[data-simon]', el); if (so) so.onchange = () => { this.sim.on = so.checked; };
    $$('[data-pmin]', el).forEach(x => x.onchange = () => { E.s.plan[+x.dataset.pmin].min = Math.max(1, +x.value || 1); E.touch(); });
    $$('[data-pcnt]', el).forEach(x => x.onchange = () => { E.s.plan[+x.dataset.pcnt].count = Math.max(1, Math.min(20, +x.value || 1)); E.touch(); });
    $$('[data-bf]', el).forEach(x => { const ev = x.tagName === 'INPUT' ? 'oninput' : 'onchange'; x[ev] = () => { this.bf[x.dataset.bf] = x.value; if (x.tagName === 'INPUT') { clearTimeout(this.bft); this.bft = setTimeout(() => { $('#sidebody').innerHTML = this.side_bank(); this.bindSide(); const i = $('[data-bf="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 300); } else this.renderSide(); }; });
    const ti = $('[data-title]', el); if (ti) ti.onchange = () => { E.s.title = ti.value.slice(0, 40) || 'ميدان بناء'; E.touch(); };
    $$('[data-tname]', el).forEach(x => x.onchange = () => { const L = E.s.teams.map(t => ({ ...t })); L[+x.dataset.tname].name = x.value; E.setTeams(L); });
    $$('[data-tcolor]', el).forEach(x => x.onchange = () => { const L = E.s.teams.map(t => ({ ...t })); L[+x.dataset.tcolor].color = x.value; E.setTeams(L); });
    const lg = $('[data-logo]', el); if (lg) lg.onchange = () => this.loadLogo(lg.files[0]);
    const fn = $('[data-font]', el); if (fn) fn.onchange = () => { const f = fn.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { if (!LS.set('bena.font', r.result)) toast('الملف كبير؛ سيعمل حتى إغلاق الصفحة فقط'); Brand.apply(); toast('تم تحميل الخط'); }; r.readAsDataURL(f); };
    const u = $('[data-url]', el); if (u) u.onchange = () => { LS.set('bena.url', u.value.trim()); this.broadcast(true); this.renderSide(); };
  },
  loadLogo(f) {
    if (!f) return; const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const max = 900, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/png'); LS.set('bena.logo', url); this.extractColors(x, c.width, c.height); this.net.emit('logo', url); this.stage.refreshLogo(); this.render(); toast('تم تحديث الشعار على هذا الجهاز وشاشة العرض في المتصفح نفسه'); }; img.src = r.result; };
    r.readAsDataURL(f);
  },
  extractColors(ctx, w, h) { try { const d = ctx.getImageData(0, 0, w, h).data; const bins = {}; for (let i = 0; i < d.length; i += 16) { const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]]; if (a < 200) continue; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); if (mx - mn < 40 || mx < 60) continue; const k = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5); bins[k] = (bins[k] || 0) + 1; } const top = Object.entries(bins).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => '#' + k.split(',').map(v => ((+v << 5) + 16).toString(16).padStart(2, '0')).join('')); if (top.length) { LS.set('bena.colors', [top[0], top[1] || top[0]]); Brand.apply(); } } catch (e) { } },
  // ---------- الأوامر ----------
  act(a, arg, btn) {
    const E = this.e, s = E.s, it = E.item();
    const [x, y] = String(arg || '').split('|');
    switch (a) {
      case 'start': E.goSegment(0); break;
      case 'goseg': if (s.planIdx >= 0 && +arg !== s.planIdx) confirmBox('الانتقال إلى «' + E.segName(s.plan[+arg].g) + '»؟ ستُترك الجولة الحالية (النقاط محفوظة).', () => E.goSegment(+arg)); else E.goSegment(+arg); break;
      case 'nextseg': E.nextSegment(); break;
      case 'next': E.nextItem(); break;
      case 'open': E.openItem(); break;
      case 'memhide': E.memHide(); break;
      case 'judge': E.judge(arg === '1'); break;
      case 'reopen': E.reopen(); break;
      case 'reveal': E.revealItem(); break;
      case 'lock': E.lockAll(); break;
      case 'clue': E.revealClue(); break;
      case 'mbuzz': E.manualBuzz(arg); break;
      case 'mode': E.setMode(arg); break;
      case 'teammark': E.teamMark($$('[data-tok]').filter(c => c.checked).map(c => c.dataset.tok)); break;
      case 'spin': E.spin(); break;
      case 'box': E.openBox(+arg); break;
      case 'luck': E.applyLuck(arg === '1'); break;
      case 'closebids': $$('[data-bid]').forEach(i => { if (i.value !== '') E.setBid(i.dataset.bid, i.value); }); E.closeBids(); break;
      case 'auc': E.judgeAuction(arg === '1'); break;
      case 'lockw': $$('[data-wager]').forEach(i => E.setWager(i.dataset.wager, i.value)); E.lockWagers(); break;
      case 'judgew': E.judgeWager($$('[data-wok]').filter(c => c.checked).map(c => c.dataset.wok)); break;
      case 'taboostart': E.tabooStart(); break;
      case 'tabook': E.tabooMark(arg === '1'); break;
      case 'tabooend': E.tabooEnd(); break;
      case 'tabooskip': it.revealed = true; s.seg.phase = 'reveal'; it.result = { pts: 0 }; E.touch(); break;
      case 'place': E.livePlace(arg); break;
      case 'livescorephase': s.seg.phase = 'score'; E.touch(); break;
      case 'livescore': E.liveScore(); break;
      case 'vote': E.openVote(); break;
      case 'closevote': E.closeVote(); break;
      case 'survend': E.survivalEnd(); break;
      case 'tiebreak': E.startTiebreak(); break;
      case 'backcrown': E.goSegment(s.returnTo != null ? s.returnTo : s.plan.length - 1); break;
      case 'pause': E.pauseTimer(); break;
      case 'resume': E.resumeTimer(); break;
      case 'add10': E.addTime(10); break;
      case 'cleartimer': E.clearTimer(); E.touch(); break;
      case 'undo': { const l = E.undo(); toast(l ? 'تم التراجع: ' + l : 'لا يوجد ما يُتراجع عنه'); break; }
      case 'card': if (y === 'freeze') { modal(`<div class="col"><b>تجميد أي فريق؟ (لا يستطيع الاستباق في السؤال التالي الذي يشارك فيه)</b><div class="ctl">${s.teams.filter(t => t.id !== x).map(t => `<button class="btn" data-fz="${t.id}" style="border-bottom:3px solid ${t.color}">${esc(t.name)}</button>`).join('')}</div><button class="btn" data-close>إلغاء</button></div>`, (m, close) => $$('[data-fz]', m).forEach(b => b.onclick = () => { E.useCard(x, 'freeze', b.dataset.fz); close(); })); } else E.useCard(x, y); break;
      case 'adj': E.manualAdjust(x, +y); break;
      case 'adjc': modal(`<div class="col"><b>تعديل نقاط ${esc(E.team(arg).name)}</b><input class="in" type="number" id="adv" placeholder="مثال: 15 أو -10"><input class="in" id="adw" placeholder="السبب"><div class="row"><button class="btn pri" data-ok>اعتماد</button><button class="btn" data-close>إلغاء</button></div></div>`, (m, close) => { $('[data-ok]', m).onclick = () => { const v = Math.round(+$('#adv', m).value); if (v) E.manualAdjust(arg, v, $('#adw', m).value || 'تعديل يدوي'); close(); }; }); break;
      case 'mission': E.missionDone(arg); break;
      case 'missions': E.assignMissions(); break;
      case 'tab': if (['room', 'plan', 'bank', 'log', 'settings', 'archive', 'help'].includes(arg)) { this.sideTab = arg; this.renderSide(); } break;
      case 'copy': this.copy(arg); break;
      case 'newcode': s.code = E.makeCode(); this.afterReset(); break;
      case 'balance': E.autoBalance(); break;
      case 'kick': confirmBox('إزالة هذا المشارك؟ (لن يُسمح له بالعودة بالجهاز نفسه)', () => E.removeStudent(arg, true)); break;
      case 'bots': this.addBots(+arg); break;
      case 'nobots': this.removeBots(); break;
      case 'plan60': E.setPlan(D.DEFAULT_PLAN); break;
      case 'plannew': E.setPlan([{ g: 'opening', min: 4 }, { g: 'everyone', min: 7 }, { g: 'whoami', min: 7 }, { g: 'duel', min: 8 }, { g: 'consensus', min: 4 }, { g: 'estimate', min: 5 }, { g: 'survival', min: 6 }, { g: 'boxes', min: 5 }, { g: 'final', min: 11 }, { g: 'crown', min: 3 }]); break;
      case 'pup': if (+arg > 0) { const p = s.plan; [p[+arg - 1], p[+arg]] = [p[+arg], p[+arg - 1]]; if (s.planIdx === +arg) s.planIdx--; else if (s.planIdx === +arg - 1) s.planIdx++; E.touch(); } break;
      case 'pdown': if (+arg < s.plan.length - 1) { const p = s.plan; [p[+arg + 1], p[+arg]] = [p[+arg], p[+arg + 1]]; if (s.planIdx === +arg) s.planIdx++; else if (s.planIdx === +arg + 1) s.planIdx--; E.touch(); } break;
      case 'pdel': if (+arg !== s.planIdx) { s.plan.splice(+arg, 1); if (s.planIdx > +arg) s.planIdx--; E.touch(); } break;

      case 'qadd': this.qAddForm(); break;
      case 'qimport': this.qImport(); break;
      case 'qexport': this.textOut('تصدير الأسئلة المخصّصة (JSON)', JSON.stringify(this.custom, null, 1)); break;
      case 'tdel': { const L = s.teams.filter((_, i) => i !== +arg); E.setTeams(L); break; }

  copy(t) { try { navigator.clipboard.writeText(t).then(() => toast('تم النسخ'), () => this.textOut('انسخ النص', t)); } catch (e) { this.textOut('انسخ النص', t); } },

      $('[data-ok]', m).onclick = () => { const v = id => $('#' + id, m).value.trim(); const c = [v('na'), v('w1'), v('w2'), v('w3')]; if (!v('nq') || c.some(x => !x)) return toast('أكمل السؤال والخيارات الأربعة'); if (new Set(c).size < 4) return toast('الخيارات مكررة'); this.custom.push({ id: 'u' + Date.now().toString(36), kind: 'mcq', cat: v('nc'), d: +v('nd'), q: v('nq'), c, src: v('ns') }); this.saveBank(); close(); this.renderSide(); toast('أُضيف السؤال'); };

        const ok = items.filter(x => x && typeof x.q === 'string' && x.q.trim() && (x.kind !== 'mcq' || (Array.isArray(x.c) && x.c.length === 4 && x.c.every(c => typeof c === 'string' && c)))).map((x, i) => Object.assign({}, x, { id: 'u' + Date.now().toString(36) + i, kind: x.kind || 'mcq', cat: D.CATS[x.cat] ? x.cat : 'general', d: [1, 2, 3].includes(+x.d) ? +x.d : 2 }));
        this.custom.push(...ok); this.saveBank(); close(); this.renderSide(); toast('استُورد ' + ok.length + ' من ' + items.length);

  presentMode() {

    const st = new Stage(ov, { sound: true }); st.setRoster(this.e.roster()); st.update(this.pubState()); this.present = st;
    const ex = document.createElement('button'); ex.className = 'btn sm'; ex.textContent = '✕ رجوع للوحة (Esc)'; ex.style.cssText = 'position:fixed;top:8px;left:8px;z-index:501;opacity:.25'; ex.onmouseenter = () => ex.style.opacity = 1; ex.onmouseleave = () => ex.style.opacity = .25;
    const close = () => { ov.remove(); ex.remove(); clearInterval(st.loop); this.present = null; try { document.fullscreenElement && document.exitFullscreen(); } catch (e) { } };
    ex.onclick = close; document.body.appendChild(ex); this.closePresent = close;
    try { document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }

    const E = this.e, seg = E.s.seg;
    if (seg && seg.phase === 'answering' && (e.key === '1' || e.key === '0')) { this.act('judge', e.key); return; }
    if (e.key === ' ' && !e.repeat) { const b = $('#deck .btn.pri.big'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }

/* ===== قرية الحرب والألعاب الجديدة: القصف، الاتهام، اختراق الخزنة، المعركة، القرعة ===== */
const BKEYS = ['wall', 'tower', 'barracks', 'catapult'];
function vRow(P, tid) { const r = (P && P.V || []).find(x => x[0] === tid); return r ? { gold: r[1], b: { wall: r[2], tower: r[3], barracks: r[4], catapult: r[5] }, atk: r[6], def: r[7] } : null; }
function lvlIcons(v) { return BKEYS.map(k => `<span title="${D.BUILD[k].name}">${D.BUILD[k].icon}${v.b[k]}</span>`).join(' '); }

// رسم القرية: يتغيّر الشكل مع كل مستوى بناء
function villageSVG(color, v) {
  const b = v ? v.b : { wall: 0, tower: 0, barracks: 0, catapult: 0 };
  let g = `<ellipse cx="200" cy="228" rx="195" ry="26" fill="#1d3b2c"/><ellipse cx="200" cy="222" rx="180" ry="20" fill="#2f5a3e"/>`;
  const tower = (x, h) => `<g><rect x="${x - 15}" y="${222 - h}" width="30" height="${h}" fill="#8f969e" stroke="#4b5158" stroke-width="2"/>${[0, 1, 2].map(i => `<rect x="${x - 15 + i * 11}" y="${214 - h}" width="8" height="9" fill="#8f969e" stroke="#4b5158" stroke-width="1.5"/>`).join('')}<rect x="${x - 4}" y="${232 - h}" width="8" height="12" fill="#2b2f33"/><line x1="${x}" y1="${214 - h}" x2="${x}" y2="${188 - h}" stroke="#ddd" stroke-width="2"/><polygon points="${x},${188 - h} ${x + 18},${194 - h} ${x},${200 - h}" fill="${color}"/></g>`;
  if (b.tower >= 3) g += tower(200, 120);
  // الثكنات (خيام) يسارًا
  for (let i = 0; i < b.barracks; i++) { const x = 34 + i * 40; g += `<polygon points="${x},212 ${x + 19},170 ${x + 38},212" fill="#c9a46a" stroke="#7a5a2c" stroke-width="2"/><polygon points="${x + 13},212 ${x + 19},190 ${x + 25},212" fill="#5b3f1c"/><line x1="${x + 19}" y1="170" x2="${x + 19}" y2="154" stroke="#ddd" stroke-width="2"/><polygon points="${x + 19},154 ${x + 32},158 ${x + 19},163" fill="${color}"/>`; }
  // المنجنيق يمينًا
  for (let i = 0; i < b.catapult; i++) { const x = 300 + i * 32; g += `<g stroke="#5b3f1c" stroke-width="4" fill="none"><line x1="${x}" y1="206" x2="${x + 26}" y2="206"/><line x1="${x + 8}" y1="206" x2="${x + 14}" y2="186"/><line x1="${x + 14}" y1="186" x2="${x + 30}" y2="164"/></g><circle cx="${x + 31}" cy="162" r="5" fill="#777"/><circle cx="${x + 4}" cy="210" r="6" fill="#3a2a14"/><circle cx="${x + 22}" cy="210" r="6" fill="#3a2a14"/>`; }
  // القلعة الرئيسة
  g += `<rect x="160" y="126" width="80" height="80" fill="#e4dac0" stroke="#8a7d5c" stroke-width="2"/><polygon points="150,128 200,84 250,128" fill="${color}" stroke="rgba(0,0,0,.35)" stroke-width="2"/><rect x="190" y="174" width="20" height="32" rx="9" fill="#5b3f1c"/><rect x="172" y="140" width="14" height="14" fill="#6b8fb3"/><rect x="214" y="140" width="14" height="14" fill="#6b8fb3"/><line x1="200" y1="84" x2="200" y2="52" stroke="#eee" stroke-width="2.5"/><polygon points="200,52 226,59 200,66" fill="${color}"/>`;
  if (b.tower >= 1) g += tower(95, 92);
  if (b.tower >= 2) g += tower(305, 92);
  // السور: خشب ← حجر ← حصن
  if (b.wall === 1) { for (let x = 52; x < 350; x += 13) { if (x > 178 && x < 222) continue; g += `<rect x="${x}" y="190" width="10" height="30" rx="3" fill="#8b5a2b" stroke="#5b3a1a" stroke-width="1.5"/><polygon points="${x},190 ${x + 5},182 ${x + 10},190" fill="#8b5a2b"/>`; } }
  if (b.wall >= 2) { const h = b.wall === 3 ? 44 : 32, y = 222 - h, col = b.wall === 3 ? '#6f7780' : '#9aa1a8'; g += `<rect x="46" y="${y}" width="132" height="${h}" fill="${col}" stroke="#3e444a" stroke-width="2"/><rect x="222" y="${y}" width="132" height="${h}" fill="${col}" stroke="#3e444a" stroke-width="2"/>`; for (let x = 46; x < 354; x += 18) { if (x > 172 && x < 222) continue; g += `<rect x="${x}" y="${y - 9}" width="11" height="10" fill="${col}" stroke="#3e444a" stroke-width="1.5"/>`; } g += `<path d="M178 222 V${y + 6} Q200 ${y - 14} 222 ${y + 6} V222 Z" fill="#3b2a16" stroke="#3e444a" stroke-width="2"/>`; if (b.wall === 3) g += `<line x1="182" y1="${y + 10}" x2="182" y2="222" stroke="#222" stroke-width="2"/><line x1="190" y1="${y + 2}" x2="190" y2="222" stroke="#222" stroke-width="2"/><line x1="200" y1="${y - 2}" x2="200" y2="222" stroke="#222" stroke-width="2"/><line x1="210" y1="${y + 2}" x2="210" y2="222" stroke="#222" stroke-width="2"/><line x1="218" y1="${y + 10}" x2="218" y2="222" stroke="#222" stroke-width="2"/>`; }
  return `<svg viewBox="0 0 400 255" class="vsvg">${g}</svg>`;
}

// ---------- المسرح ----------
(function () {
  const S = Stage.prototype;
  const base = { mainHTML: S.mainHTML, mainKey: S.mainKey, openingHTML: S.openingHTML, crownHTML: S.crownHTML, statusHTML: S.statusHTML };
  S.mainKey = function (P) { const I = P.I || {}; return base.mainKey.call(this, P) + JSON.stringify([P.V, P.bomb, P.bs, P.dn, I.sh && [I.sh[0], I.sh[2]], I.shl && I.shl.length, I.vt && [I.vt.cr, Object.keys(I.vt.lk || {}), I.vt.tr], P.tr, I.res2 ? 1 : 0, P.dn ? (this.R.L || []).map(x => x[2]).join() : 0]); };
  S.villageCard = function (P, t, extra = '') { const v = vRow(P, t.id); return `<div class="vcard" style="--tc:${t.color}"><div class="vh"><b>${esc(t.name)}</b><span>💰 ${v ? v.gold : 0}</span></div>${villageSVG(t.color, v)}<div class="vf">${v ? lvlIcons(v) : ''}<span class="pw">⚔️ ${v ? v.atk : 5} · 🛡️ ${v ? v.def : 5}</span></div>${extra}</div>`; };
  S.mainHTML = function (P) {
    const I = P.I || {};
    if (P.g === 'battle' && P.ph !== 'intro' && P.ph !== 'done') return this.battleHTML(P);
    if (P.g === 'council' && P.I && P.ph !== 'done') return this.councilHTML(P);
    if (I.k === 'roles') return `<div class="intro"><div class="ico">🎭</div><div class="nm" style="font-size:96px">في كل فريق مخرّب سري</div><div class="ds">افتحوا جوالاتكم بعيدًا عن أعين زملائكم: جوالك يخبرك هل أنت المخرّب أم من الأوفياء.<br>إجابة الفريق = رأي أغلبيته. المخرّب يحاول تضليلكم دون أن ينكشف.</div>${P.tr < this.teams().length ? '<div class="ds" style="font-size:28px">(الفرق التي يقل أعضاؤها عن 3 تلعب دون مخرّب)</div>' : ''}</div>`;
    if (I.k === 'accuse') return this.accuseHTML(P);
    if (I.k === 'vault') return this.vaultHTML(P);
    if (P.bomb && (P.ph === 'aim' || (P.ph === 'reveal' && I.shl && I.shl.length))) return this.bombHTML(P);
    return base.mainHTML.call(this, P);
  };
  S.councilHTML = function (P) {
    const I = P.I, T = this.teams(), R = I.res2 || {};
    const head = P.ph === 'reveal' ? 'قرارات مجالس القرى' : P.ph === 'open' ? 'صوّتوا من جوالاتكم: ماذا نبني بذهبنا؟' : 'مجلس القرية';
    return `<div class="big-q sm" style="margin-bottom:20px">🏗️ ${head}</div><div class="vgrid" style="--n:${T.length}">${T.map(t => { const r = R[t.id]; const built = r && r.built ? (r.built.length ? 'بنى: ' + r.built.map(k => D.BUILD[k].icon + ' ' + D.BUILD[k].name).join('، ') : 'ادّخر ذهبه') : ''; return this.villageCard(P, t, built ? `<div class="vb">${esc(built)}</div>` : ''); }).join('')}</div><div data-dyn="status"></div>`;
  };
  S.battleHTML = function (P) {
    const T = this.teams(), bt = P.bt || [], k = P.bs || 0;
    if (!k) return `<div class="big-q sm" style="margin-bottom:20px">🏰 الجيوش تتجهز للمعركة الكبرى</div><div class="vgrid" style="--n:${T.length}">${T.map(t => this.villageCard(P, t)).join('')}</div><div class="status-line">كل فريق يهاجم البقية: إن غلبت قوةُ هجومه دفاعَ الخصم ربح <b>+10</b>، وإلا ربح المدافع <b>+5</b></div>`;
    const r = bt[k - 1], A = this.tm(r[0]);
    return `<div class="battle"><div class="att">${this.villageCard(P, { id: r[0], name: A.name, color: A.color })}<div class="mini-bz" style="--tc:${A.color};margin-top:16px">⚔️ يهاجم بقوة ${r[1]}</div></div><div class="vs-list">${r[3].map(([b, win, pts], i) => { const B = this.tm(b); return `<div class="vrow ${win ? 'win' : 'hold'}" style="--tc:${B.color};animation-delay:${.4 + i * .5}s"><b>${esc(B.name)}</b><span>🛡️ ${(bt.find(x => x[0] === b) || [])[2]}</span><span class="res">${win ? '💥 اخترق السور  +10 ' + esc(A.name) : '🛡️ صمد  +5 ' + esc(B.name)}</span></div>`; }).join('')}</div></div><div class="status-line">الهجوم ${k} من ${bt.length}</div>`;
  };
  S.bombHTML = function (P) {
    const I = P.I, T = this.teams(), sh = I.sh || [], last = I.shl && I.shl[I.shl.length - 1];
    const shooter = this.tm(sh[0]);
    let line = '';
