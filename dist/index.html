    if (seg.phase === 'aim' && it.shooter) {
      const sh = it.shooter;
      return `<div class="h" style="font-size:20px">🎯 ${esc(tn(sh.team))} يقصف${sh.sid && s.students[sh.sid] ? ' — ' + esc(s.students[sh.sid].name) + ' يختار من جواله' : ''} (قذائف: ${it.shots})</div><div class="note">القيم ظاهرة لك فقط. يمكنك القصف نيابةً عنه بالضغط على خانة.</div><div class="hbgrids">${T.filter(t => t.id !== sh.team).map(t => `<div><b style="color:${t.color}">${esc(t.name)}</b><div class="hcells">${s.bomb[t.id].map((c, i) => `<button class="${c.hit ? 'hit' : ''}" data-act="shoot" data-arg="${t.id}|${i}" ${c.hit ? 'disabled' : ''}>${c.hit ? (c.sh ? '🛡️' : '💥' + c.v) : (c.sh ? '🛡️' : '') + c.v}</button>`).join('')}</div></div>`).join('')}</div><div class="ctl"><button class="btn" data-act="randshot">🎲 قصف عشوائي</button></div>` + timer;
    }
    let h = base.itemDeck.call(this, seg, it, timer);
    if (it.kind === 'council') h = `<div class="col">${T.map(t => { const v = E.vil(t.id), p = E.power(t.id); return `<div class="row wrap"><b style="color:${t.color};min-width:70px">${esc(t.name)}</b><span>💰 ${v.gold}</span><span>${lvlIcons(v)}</span><span class="mut">⚔️${p.atk} 🛡️${p.def}</span></div>`; }).join('')}</div>` + h;
    if (it.kind === 'accuse') h = `<div class="note">المخرّبون: ${T.map(t => esc(t.name) + ': ' + (seg.sab[t.id] ? esc((s.students[seg.sab[t.id]] || {}).name || '') : '—')).join(' · ')}</div>` + h;
    return h;
  };
  Host.renderTeams = function () {
    base.renderTeams.call(this);
    const E = this.e; if (E.s.settings.village === false) return;
    const cards = $$('#teams .tcard');
    E.s.teams.forEach((t, i) => { const el = cards[i]; if (!el || $('.vline', el)) return; const v = E.vil(t.id), p = E.power(t.id); const d = document.createElement('div'); d.className = 'vline'; d.innerHTML = `<span>💰 ${v.gold}</span><span>${lvlIcons(v)}</span><span class="mut">⚔️${p.atk} 🛡️${p.def}</span><button class="chipbtn" data-act="buildm" data-arg="${t.id}">🏗️ بناء</button>`; el.appendChild(d); });
  };
  Host.side_settings = function () { const st = this.e.s.settings; return base.side_settings.call(this).replace('<hr style="border-color:var(--line)">', `<label class="row"><input type="checkbox" data-set="village" ${st.village !== false ? 'checked' : ''}> قرية الحرب (الذهب والمباني والمعركة)</label><label class="row"><input type="checkbox" data-set="drawInOpening" ${st.drawInOpening !== false ? 'checked' : ''}> قرعة الفرق على الشاشة في الافتتاح</label><hr style="border-color:var(--line)">`); };
  Host.side_plan = function () { return base.side_plan.call(this).replace('<button class="btn sm" data-act="plan60">البرنامج الافتراضي</button>', '<button class="btn sm" data-act="plan60">قصة قرية الحرب</button><button class="btn sm" data-act="planclassic">البرنامج الكلاسيكي</button>'); };
  Host.act = function (a, arg, btn) {
    const E = this.e, [x, y] = String(arg || '').split('|');
    switch (a) {
      case 'buildm': return this.buildModal(arg);
      case 'shoot': E.shoot(x, +y); return;
      case 'randshot': E.randomShot(); return;
      case 'resab': E.reassignSabs(); return;
      case 'drawteams': E.drawTeams(); return;
      case 'planclassic': E.setPlan(D.CLASSIC_PLAN); return;
      case 'vaultman': { const it = E.item(); const m = E.teamMembers(x)[0]; if (it && m) { it.lock[x] = 0; E.vaultTry(m.sid, it.qid, it.a); } return; }
    }
    return base.act.call(this, a, arg, btn);
  };
  Host.buildModal = function (tid) {
    const E = this.e, t = E.team(tid);
    const html = () => { const v = E.vil(tid); return `<div class="col"><div class="h" style="font-size:20px">🏗️ بناء قرية ${esc(t.name)} — 💰 ${v.gold}</div><div style="max-width:320px;margin:auto">${villageSVG(t.color, v)}</div>${BKEYS.map(k => { const lv = v.b[k], c = E.buildCost(tid, k); return `<div class="row"><span style="font-size:22px">${D.BUILD[k].icon}</span><div class="grow"><b>${D.BUILD[k].name}</b> <span class="mut">${lv}/3</span><div class="mut" style="font-size:12px">${esc(D.BUILD[k].desc)}</div></div><button class="btn sm ${c != null && c <= v.gold ? 'pri' : ''}" data-up="${k}" ${c == null || c > v.gold ? 'disabled' : ''}>${c == null ? 'مكتمل' : 'بناء (' + c + ')'}</button></div>`; }).join('')}<div class="note">الطريقة المفضلة أن يقرر الفريق في «مجلس القرية» من جوالاتهم. استخدم هذا للطوارئ أو حين يطلب الفريق شفهيًا.</div><button class="btn" data-close>إغلاق</button></div>`; };
    modal(html(), (m, close) => { const bindUp = () => $$('[data-up]', m).forEach(b => b.onclick = () => { E.upgrade(tid, b.dataset.up); m.innerHTML = html(); $$('[data-close]', m).forEach(c => c.onclick = close); bindUp(); }); bindUp(); });
  };
})();

/* ===== شاشة العرض + البوابة + التوجيه ===== */
const Display = {
  init(code) {
    this.code = code || LS.get('bena.displayCode', '') || '';
    this.root = $('#app'); this.root.innerHTML = '<div class="stage-host" id="dsp"></div>';
    this.stage = new Stage($('#dsp'), { sound: true });
    this.net = new Net('display'); this.lastHs = null; this.lastV = -1; this.got = 0;
    this.net.on('state', P => this.onState(P));
    this.net.on('roster', R => { if (R && R.L) this.stage.setRoster(R); });
    this.net.on('logo', () => this.stage.refreshLogo());
    this.net.on('caps', () => { if (this.code) this.join(this.code); });
    this.net.on('status', () => this.badge());
    this.net.init();
    this.net.presence({ r: 'd' });
    setInterval(() => this.net.bcPres(), 3000);
    window.addEventListener('pagehide', () => this.net.bye());
    this.overlay();
    setTimeout(() => { if (!this.got) this.askCode(); }, 3500);
  },
  async join(code) { this.code = code; LS.set('bena.displayCode', code); this.net.code = code; await this.net.joinRoom(code); this.net.presence({ r: 'd', c: code }); this.badge(); },
  onState(P) {
    if (!P) return;
    if (this.code && P.code !== this.code) { if (this.got) return; }
    if (!this.code && P.code) { this.code = P.code; this.join(P.code); }
    if (P.hs !== this.lastHs) { this.lastHs = P.hs; this.lastV = -1; }
    if (P.v < this.lastV) return;
    this.lastV = P.v; this.got = Date.now();
    const ask = $('#askcode'); if (ask) ask.remove();
    this.stage.update(P);
  },
  overlay() {
    const o = document.createElement('div'); o.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,20,26,.75);cursor:pointer';
    o.innerHTML = '<div class="card" style="text-align:center;max-width:520px"><div class="h" style="font-size:24px">🖥️ شاشة العرض</div><div class="note" style="margin-top:8px">اضغط في أي مكان لتفعيل الصوت وملء الشاشة</div></div>';
    o.onclick = () => { SFX.unlock(); try { document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { } o.remove(); };
    document.body.appendChild(o);
    const b = document.createElement('div'); b.id = 'dbadge'; b.style.cssText = 'position:fixed;bottom:6px;left:8px;z-index:40;font-size:11px;opacity:.45'; document.body.appendChild(b); this.badge();
  },
  badge() { const b = $('#dbadge'); if (b) { const l = this.net.label(); b.innerHTML = `<span class="dot ${l.cls}"></span> ${esc(l.t)}${this.code ? ' · ' + esc(this.code) : ''}`; } },
  askCode() {
    if ($('#askcode')) return;
    const d = document.createElement('div'); d.id = 'askcode'; d.className = 'card'; d.style.cssText = 'position:fixed;top:16px;left:16px;z-index:60;width:320px';
    d.innerHTML = `<div class="col"><b>لم تصل حالة المسابقة بعد</b><div class="note">إن كانت لوحة المشرف في المتصفح نفسه فستظهر تلقائيًا. على جهاز آخر أدخل رمز الغرفة:</div><div class="row"><input class="in grow" id="dcode" maxlength="4" inputmode="numeric" value="${esc(this.code)}" style="direction:ltr;text-align:center;letter-spacing:6px"><button class="btn pri" id="dgo">ربط</button></div></div>`;
    document.body.appendChild(d);
    $('#dgo').onclick = () => { const c = $('#dcode').value.replace(/\D/g, ''); if (c.length === 4) { this.join(c); toast('جارٍ الربط بالغرفة ' + c); } };
  }
};

const Landing = {
  async init() {
    const root = $('#app');
    root.innerHTML = `<div class="landing"><div class="box"><div class="row" style="gap:28px;align-items:center;flex-wrap:wrap"><div style="height:220px;width:170px;flex:none">${Brand.logoImg()}</div><div><h1>ميدان <span>بناء</span></h1><div class="mut" style="font-size:18px;margin-top:10px">منصة المسابقات الشبابية التفاعلية لفريق بناء</div></div></div>
      <div class="roles">
        <button class="role" data-go="join"><span class="ic">📱</span><b>دخول المتسابق</b><span class="mut">من الجوال: اسمك ورمز الغرفة</span></button>
        <button class="role" data-go="display"><span class="ic">🖥️</span><b>شاشة العرض</b><span class="mut">للبروجكتور أو الشاشة الكبيرة</span></button>
        <button class="role" data-go="host" id="hostbtn"><span class="ic">🎛️</span><b>لوحة المشرف</b><span class="mut">إنشاء الغرفة وإدارة المسابقة</span></button>
      </div><div class="note" style="margin-top:18px" id="lnote"></div></div></div>`;
    $$('[data-go]', root).forEach(b => b.onclick = () => { SFX.unlock(); route(b.dataset.go); });
    try { const u = window.claude && await Promise.race([window.claude.use('user'), new Promise(r => setTimeout(() => r(null), 4000))]); if (u && !u.canEdit()) { $('#hostbtn').style.opacity = .45; $('#lnote').textContent = 'لوحة المشرف متاحة لمالك الصفحة ومحرريها فقط.'; } } catch (e) { }
  }
};

function route(to) {
  const h = (location.hash || '').replace('#', '');
  const r = to || h;
  if (to) { try { history.replaceState(null, '', '#' + (to === 'join' ? 'play' : to)); } catch (e) { } }
  if (r === 'host') return Host.init();
  if (r.startsWith('display')) return Display.init((r.split('-')[1] || '').replace(/\D/g, '').slice(0, 4));
  if (r === 'join' || r === 'play' || r.startsWith('join-')) return Student.init((r.split('-')[1] || '').replace(/\D/g, '').slice(0, 4) || null);
  const P = LS.get('bena.player', null);
  return Landing.init();
}
Brand.apply();
route();
</script>
